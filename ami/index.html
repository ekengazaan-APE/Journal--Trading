function toggleScalpInstr(){var s=document.getElementById('sc-instr'),i=document.getElementById('sc-instr-custom');if(!s||!i)return;if(s.value==='Autre'){i.style.display='block';i.focus();}else i.style.display='none';}
function scalpFormPreview(){
  var el=document.getElementById('sc-preview');if(!el)return;
  var n=parseInt((document.getElementById('sc-ntrades')||{}).value),w=parseInt((document.getElementById('sc-nwins')||{}).value);
  if(!isNaN(n)&&n>0&&!isNaN(w)){el.style.display='block';el.innerHTML='Win rate de la session : <b style="color:var(--accent)">'+Math.round(w/n*100)+'%</b> ('+w+' / '+n+')';}
  else el.style.display='none';
}
function openScalpModal(prefill){
  _editingScalpId=prefill?prefill.id:null;
  var f=prefill||{date:today(),instrument:'NQ',session:'Session NY'};
  document.getElementById('modal-title').textContent=_editingScalpId?'MODIFIER LA SESSION SCALP':'NOUVELLE SESSION SCALP';
  document.getElementById('modal-body').innerHTML=scalpForm(f);
  document.getElementById('modal-overlay').classList.add('open');
}
function editScalp(id){var s=getScalps().find(function(x){return x.id===id;});if(s)openScalpModal(s);}
function deleteScalp(id){
  if(!confirm('Supprimer cette session scalp ?'))return;
  setScalps(getScalps().filter(function(x){return x.id!==id;}));
  toast('Session supprimée');nav('scalps');
}
function saveScalp(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  var instr=g('sc-instr')==='Autre'?(g('sc-instr-custom')||'Autre'):g('sc-instr');
  var rec={
    id:_editingScalpId||('sc'+uid()),
    date:g('sc-date')||today(),
    account:g('sc-account')||'',
    instrument:instr||'NQ',
    session:g('sc-session')||'Session NY',
    nTrades:g('sc-ntrades')||'0',
    nWins:g('sc-nwins')||'0',
    plDollar:g('sc-pl')||'0',
    plR:g('sc-plr')||'',
    note:g('sc-note')||''
  };
  var list=getScalps();
  if(_editingScalpId){var i=list.findIndex(function(x){return x.id===_editingScalpId;});if(i>-1)list[i]=rec;else list.push(rec);}
  else list.push(rec);
  setScalps(list);
  _editingScalpId=null;
  closeModal();
  toast('Session scalp enregistrée');
  nav('scalps');
}

// ── RENTABILITÉ (business) ───────────────────────────────────────────────────
// Suivi des comptes ACHETÉS vs payouts reçus : suis-je rentable sur TOUS mes comptes ?
var _editingRentId=null;
var RENT_FIRMS=['Apex','Lucid','FTMO','TopStep','MyFunded','The5ers','Autre'];
var RENT_STATUS=['En cours','Financé','Cramé'];
var RENT_STATUS_COLORS={'En cours':'#f59e0b','Financé':'#00d46a','Cramé':'#9b5de5'};
function getRent(){return DB._l('tj_rent',[]);}
function setRent(v){DB._s('tj_rent',v);}
function rentPayouts(a){return (a.payouts||[]).reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0);}

function daysBetween(a,b){if(!a||!b)return null;var d=(new Date(b)-new Date(a))/86400000;return isNaN(d)?null:Math.round(d);}
function firstPayoutDate(a){var ds=(a.payouts||[]).map(function(p){return p.date;}).filter(Boolean).sort();return ds[0]||null;}
function rentStats(list){
  var spent=0,received=0,funded=0,crame=0,encours=0,withPayout=0;
  var passDelays=[],payoutDelays=[],crameLives=[];
  list.forEach(function(a){
    spent+=parseFloat(a.price)||0;
    received+=rentPayouts(a);
    var hasPayout=(a.payouts||[]).length>0;if(hasPayout)withPayout++;
    if(a.status==='Financé')funded++;
    else if(a.status==='Cramé')crame++;
    else encours++;
    // délais
    var dPass=daysBetween(a.date,a.dateFunded);if(dPass!==null&&dPass>=0)passDelays.push(dPass);
    var fp=firstPayoutDate(a);
    if(fp){var base=a.dateFunded||a.date;var dPay=daysBetween(base,fp);if(dPay!==null&&dPay>=0)payoutDelays.push(dPay);}
    var dCrame=daysBetween(a.date,a.dateCrame);if(dCrame!==null&&dCrame>=0)crameLives.push(dCrame);
  });
  var resolved=funded+crame;
  var avg=function(arr){return arr.length?Math.round(arr.reduce(function(s,v){return s+v;},0)/arr.length):null;};
  return {
    spent:spent,received:received,net:received-spent,
    roi:spent>0?(received-spent)/spent*100:0,
    funded:funded,crame:crame,encours:encours,total:list.length,withPayout:withPayout,
    passRate:resolved>0?Math.round(funded/resolved*100):0,
    costPerFunded:funded>0?spent/funded:null,
    payoutConversion:list.length>0?Math.round(withPayout/list.length*100):0,
    avgDaysToPass:avg(passDelays),avgDaysToPayout:avg(payoutDelays),avgLifeCrame:avg(crameLives)
  };
}

function rentability(){
  var list=allPurchasedItems().slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var S=rentStats(list);
  var head='<div class="flex-between" style="margin-bottom:14px;flex-wrap:wrap;gap:8px">'
    +'<div><div class="page-title">💰 RENTABILITÉ</div><div class="page-sub">COMPTES ACHETÉS vs PAYOUTS — SUIS-JE VRAIMENT RENTABLE ?</div></div>'
    +'<button class="btn btn-primary btn-sm" onclick="openRentModal()">+ Compte acheté</button></div>';

  if(!list.length){
    return head+'<div class="card" style="border-color:rgba(59,130,246,0.3)"><div style="font-size:12px;color:var(--text);line-height:1.7;padding:6px">'
      +'Ajoute chaque compte que tu <b>achètes</b> (challenge) avec son prix et son statut. Quand un compte te verse un <b>payout</b>, tu l\'ajoutes dessus.<br>'
      +'<span style="font-size:11px;color:var(--muted)">L\'appli calcule automatiquement : total dépensé, total reçu, résultat net, ROI, ton <b>taux de passage</b> et ton <b>coût moyen par compte financé</b> — la vraie réponse à « est-ce que je gagne de l\'argent sur l\'ensemble ».</span>'
      +'<div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="openRentModal()">+ Ajouter mon premier compte</button></div></div></div>';
  }

  var netC=S.net>=0?'var(--green)':'var(--red)';
  var roiC=S.roi>=0?'var(--green)':'var(--red)';
  var kpis='<div class="grid-3" style="margin-bottom:14px">'
    +'<div class="kpi"><div class="kpi-label">TOTAL DÉPENSÉ</div><div class="kpi-value" style="color:var(--red)">'+fmt$(-S.spent).replace('−','-')+'</div><div class="kpi-sub">'+S.total+' compte'+(S.total>1?'s':'')+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">TOTAL REÇU</div><div class="kpi-value" style="color:var(--green)">'+fmt$(S.received)+'</div><div class="kpi-sub">payouts</div></div>'
    +'<div class="kpi" style="border-color:'+netC+'55"><div class="kpi-label">RÉSULTAT NET</div><div class="kpi-value" style="color:'+netC+'">'+fmt$(S.net)+'</div><div class="kpi-sub">reçu − dépensé</div></div>'
    +'<div class="kpi"><div class="kpi-label">ROI</div><div class="kpi-value" style="color:'+roiC+'">'+(S.roi>=0?'+':'')+S.roi.toFixed(0)+'%</div></div>'
    +'<div class="kpi"><div class="kpi-label">TAUX DE PASSAGE</div><div class="kpi-value" style="color:var(--accent)">'+(S.funded+S.crame>0?S.passRate+'%':'—')+'</div><div class="kpi-sub">'+S.funded+' fin. / '+S.crame+' cramé'+(S.crame>1?'s':'')+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">COÛT / COMPTE FINANCÉ</div><div class="kpi-value" style="color:var(--yellow)">'+(S.costPerFunded!==null?fmt$(S.costPerFunded).replace('+',''):'—')+'</div><div class="kpi-sub">dépensé / financés</div></div>'
    +'</div>';

  // Verdict
  var verdict='';
  if(S.total>=2){
    var vc=S.net>=0?'var(--green)':'var(--red)';
    var vtxt=S.net>=0
      ?'Tu es <b style="color:var(--green)">rentable</b> sur l\'ensemble : +'+fmt$(S.net).replace('+','')+' après avoir acheté '+S.total+' comptes.'
      :'Tu es <b style="color:var(--red)">en négatif</b> de '+fmt$(S.net).replace('−','-')+' sur l\'ensemble de tes comptes achetés. Il te faut '+fmt$(-S.net).replace('−','')+' de payouts en plus pour rentrer dans tes frais.';
    if(S.costPerFunded!==null)vtxt+=' Chaque compte financé te coûte en moyenne '+fmt$(S.costPerFunded).replace('+','')+' en challenges.';
    verdict='<div class="card" style="margin-bottom:14px;border-left:3px solid '+vc+'"><div style="font-size:12px;color:var(--text);line-height:1.6">'+vtxt+'</div></div>';
  }

  var charts_='<div class="grid-2" style="margin-bottom:14px">'
    +'<div class="card"><div class="card-title">NET CUMULÉ (DÉPENSES vs PAYOUTS)</div><canvas id="rentCumChart" height="130"></canvas></div>'
    +'<div class="card"><div class="card-title">PAR PROP FIRM — DÉPENSÉ vs REÇU</div><canvas id="rentFirmChart" height="130"></canvas></div>'
    +'</div>';

  // Répartition par firm
  var byFirm={};
  list.forEach(function(a){var f=a.firm||'Autre';if(!byFirm[f])byFirm[f]={spent:0,received:0,n:0,funded:0};byFirm[f].spent+=parseFloat(a.price)||0;byFirm[f].received+=rentPayouts(a);byFirm[f].n++;if(a.status==='Financé')byFirm[f].funded++;});
  var firmRows=Object.keys(byFirm).sort(function(a,b){return byFirm[b].received-byFirm[b].spent-(byFirm[a].received-byFirm[a].spent);}).map(function(f){
    var d=byFirm[f];var net=d.received-d.spent;
    return '<tr><td style="font-weight:700">'+f+'</td>'
      +'<td style="font-family:monospace">'+d.n+'</td>'
      +'<td style="font-family:monospace">'+d.funded+'</td>'
      +'<td style="font-family:monospace;color:var(--red)">'+fmt$(-d.spent).replace('−','-')+'</td>'
      +'<td style="font-family:monospace;color:var(--green)">'+fmt$(d.received)+'</td>'
      +'<td style="font-family:monospace;font-weight:800;color:'+(net>=0?'var(--green)':'var(--red)')+'">'+fmt$(net)+'</td></tr>';
  }).join('');
  var firmTable='<div class="card" style="margin-bottom:14px"><div class="card-title">DÉTAIL PAR PROP FIRM</div><div style="overflow-x:auto"><table><thead><tr><th>FIRM</th><th>COMPTES</th><th>FINANCÉS</th><th>DÉPENSÉ</th><th>REÇU</th><th>NET</th></tr></thead><tbody>'+firmRows+'</tbody></table></div></div>';

  // Historique comptes
  var accRows=list.map(function(a){
    var payout=rentPayouts(a);var net=payout-(parseFloat(a.price)||0);
    var sc=RENT_STATUS_COLORS[a.status]||'var(--muted)';
    return '<tr>'
      +'<td style="color:var(--muted);font-size:10px;white-space:nowrap">'+(a.date||'—')+'</td>'
      +'<td style="font-weight:700">'+(a.firm||'—')+'</td>'
      +'<td style="font-family:monospace;color:var(--red)">'+fmt$(-(parseFloat(a.price)||0)).replace('−','-')+'</td>'
      +'<td><span class="badge" style="background:'+sc+'20;color:'+sc+'">'+(a.status||'—')+'</span></td>'
      +'<td style="font-family:monospace;color:var(--green)">'+(payout?fmt$(payout):'—')+'</td>'
      +'<td style="font-family:monospace;font-weight:800;color:'+(net>=0?'var(--green)':'var(--red)')+'">'+fmt$(net)+'</td>'
      +'<td style="white-space:nowrap">'
        +'<button class="btn btn-ghost btn-sm" onclick="addPayout(\''+a.id+'\')" title="Ajouter un payout">+ 💵</button>'
        +(a.source==='account'
          ?'<button class="btn btn-ghost btn-sm" onclick="editAccount(\''+a.id+'\')" title="Modifier via Comptes Prop">✏️</button><span class="badge" style="background:var(--accent)15;color:var(--accent);margin-left:2px" title="Lié à un compte de trading">🔗</span>'
          :'<button class="btn btn-ghost btn-sm" onclick="editRent(\''+a.id+'\')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteRent(\''+a.id+'\')">🗑</button>')
      +'</td></tr>';
  }).join('');
  var accTable='<div class="card"><div class="card-title">MES COMPTES ACHETÉS</div><div style="overflow-x:auto"><table><thead><tr><th>DATE</th><th>FIRM</th><th>PRIX</th><th>STATUT</th><th>PAYOUTS</th><th>NET</th><th></th></tr></thead><tbody>'+accRows+'</tbody></table></div></div>';

  // ── Cycle de vie & délais ──
  var d=function(v){return v===null?'—':v+' j';};
  var lifecycle='<div class="card" style="margin-bottom:14px"><div class="card-title">⏱️ CYCLE DE VIE & CONVERSION</div>'
    +'<div class="grid-4">'
      +'<div class="kpi"><div class="kpi-label">TAUX DE CONVERSION</div><div class="kpi-value" style="color:var(--accent)">'+S.payoutConversion+'%</div><div class="kpi-sub">'+S.withPayout+'/'+S.total+' comptes ont payout</div></div>'
      +'<div class="kpi"><div class="kpi-label">DÉLAI POUR PASSER</div><div class="kpi-value">'+d(S.avgDaysToPass)+'</div><div class="kpi-sub">achat → financé</div></div>'
      +'<div class="kpi"><div class="kpi-label">DÉLAI 1ER PAYOUT</div><div class="kpi-value">'+d(S.avgDaysToPayout)+'</div><div class="kpi-sub">financé → payout</div></div>'
      +'<div class="kpi"><div class="kpi-label">DURÉE AVANT CRAME</div><div class="kpi-value" style="color:var(--red)">'+d(S.avgLifeCrame)+'</div><div class="kpi-sub">achat → cramé</div></div>'
    +'</div>'
    +(S.total>=3?'<div style="margin-top:10px;padding:9px;background:var(--s2);border-radius:7px;font-size:11px;color:var(--muted);line-height:1.5">'
      +'Sur <b style="color:var(--text)">'+S.total+' comptes achetés</b> : '+S.funded+' financé'+(S.funded>1?'s':'')+', '+S.crame+' cramé'+(S.crame>1?'s':'')+', '+S.encours+' en cours. '
      +'<b style="color:'+(S.payoutConversion>=30?'var(--green)':'var(--yellow)')+'">'+S.payoutConversion+'%</b> t\'ont réellement versé de l\'argent'
      +(S.payoutConversion<30&&S.total>=5?' — passer un compte ne suffit pas, l\'objectif c\'est le payout.':'.')+'</div>':'')
    +'</div>';

  // ── Bloc Payouts ──
  var allPayouts=[];
  list.forEach(function(a){(a.payouts||[]).forEach(function(pp){allPayouts.push({amount:parseFloat(pp.amount)||0,date:pp.date||'',firm:a.firm||'—'});});});
  allPayouts.sort(function(x,y){return (y.date||'').localeCompare(x.date||'');});
  var payoutBlock='';
  if(allPayouts.length){
    var totP=allPayouts.reduce(function(s,p){return s+p.amount;},0);
    var biggest=Math.max.apply(null,allPayouts.map(function(p){return p.amount;}));
    var avgP=Math.round(totP/allPayouts.length);
    var pr=allPayouts.slice(0,12).map(function(pp){
      return '<tr><td style="color:var(--muted);font-size:10px">'+(pp.date||'—')+'</td><td style="font-weight:700">'+pp.firm+'</td><td style="font-family:monospace;font-weight:800;color:var(--green)">'+fmt$(pp.amount)+'</td></tr>';
    }).join('');
    payoutBlock='<div class="card" style="margin-bottom:14px"><div class="card-title">💵 PAYOUTS REÇUS</div>'
      +'<div class="grid-4" style="margin-bottom:12px">'
        +'<div class="kpi"><div class="kpi-label">TOTAL REÇU</div><div class="kpi-value" style="color:var(--green)">'+fmt$(totP)+'</div></div>'
        +'<div class="kpi"><div class="kpi-label">NB PAYOUTS</div><div class="kpi-value">'+allPayouts.length+'</div></div>'
        +'<div class="kpi"><div class="kpi-label">PLUS GROS</div><div class="kpi-value" style="color:var(--green)">'+fmt$(biggest)+'</div></div>'
        +'<div class="kpi"><div class="kpi-label">MOYEN</div><div class="kpi-value">'+fmt$(avgP)+'</div></div>'
      +'</div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>DATE</th><th>FIRM</th><th>MONTANT</th></tr></thead><tbody>'+pr+'</tbody></table></div>'
      +(allPayouts.length>12?'<div style="font-size:10px;color:var(--muted);text-align:center;margin-top:8px">… et '+(allPayouts.length-12)+' autres</div>':'')
      +'</div>';
  }

  return head+kpis+verdict+lifecycle+charts_+payoutBlock+firmTable+accTable;
}

function initRentCharts(){
  var list=allPurchasedItems();
  if(!list.length)return;
  // Net cumulé chronologique : chaque achat = -prix à sa date, chaque payout = +montant à sa date
  var events=[];
  list.forEach(function(a){
    if(a.date)events.push({date:a.date,amt:-(parseFloat(a.price)||0)});
    (a.payouts||[]).forEach(function(p){if(p.date)events.push({date:p.date,amt:parseFloat(p.amount)||0});});
  });
  events.sort(function(x,y){return x.date.localeCompare(y.date);});
  var cum=0,pts=[],labels=[];
  events.forEach(function(e){cum+=e.amt;pts.push(Math.round(cum));labels.push(e.date);});
  var cc=document.getElementById('rentCumChart');
  if(cc){if(charts.rentCum){try{charts.rentCum.destroy();}catch(e){}}
    charts.rentCum=new Chart(cc,{type:'line',data:{labels:labels,datasets:[{data:pts,borderColor:pts.length&&pts[pts.length-1]>=0?'#00e676':'#b57bee',backgroundColor:'rgba(59,130,246,0.08)',fill:true,tension:0.2,pointRadius:2,borderWidth:2}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:8},maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},callback:function(v){return '$'+v;}}}}}});
  }
  // Par firm : dépensé vs reçu
  var byFirm={};
  list.forEach(function(a){var f=a.firm||'Autre';if(!byFirm[f])byFirm[f]={spent:0,received:0};byFirm[f].spent+=parseFloat(a.price)||0;byFirm[f].received+=rentPayouts(a);});
  var firms=Object.keys(byFirm);
  var fc=document.getElementById('rentFirmChart');
  if(fc){if(charts.rentFirm){try{charts.rentFirm.destroy();}catch(e){}}
    charts.rentFirm=new Chart(fc,{type:'bar',data:{labels:firms,datasets:[
      {label:'Dépensé',data:firms.map(function(f){return Math.round(byFirm[f].spent);}),backgroundColor:'rgba(155,93,229,0.2)',borderColor:'#b57bee',borderWidth:2,borderRadius:4},
      {label:'Reçu',data:firms.map(function(f){return Math.round(byFirm[f].received);}),backgroundColor:'rgba(0,212,106,0.2)',borderColor:'#00e676',borderWidth:2,borderRadius:4}
    ]},options:{plugins:{legend:{display:true,labels:{color:'#525278',font:{size:9},boxWidth:8}}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},callback:function(v){return '$'+v;}}}}}});
  }
}

function rentForm(f){
  var firmOpts=RENT_FIRMS.map(function(x){return '<option'+(f.firm===x?' selected':'')+'>'+x+'</option>';}).join('');
  var isCustomFirm=(f.firm&&RENT_FIRMS.indexOf(f.firm)<0);
  if(isCustomFirm)firmOpts=firmOpts.replace('<option>Autre</option>','<option selected>Autre</option>');
  var statusOpts=RENT_STATUS.map(function(x){return '<option'+(f.status===x?' selected':'')+'>'+x+'</option>';}).join('');
  return '<div class="form-grid">'
    +'<div class="section-title">💰 COMPTE ACHETÉ</div>'
    +'<div class="form-group"><label>DATE D\'ACHAT</label><input type="date" id="rt-date" value="'+(f.date||today())+'"></div>'
    +'<div class="form-group"><label>PROP FIRM</label><select id="rt-firm" onchange="toggleRentFirm()">'+firmOpts+'</select>'
      +'<input type="text" id="rt-firm-custom" placeholder="Nom de la firm" value="'+(isCustomFirm?f.firm:'')+'" style="display:'+(isCustomFirm?'block':'none')+';margin-top:8px;width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font-family:inherit;font-size:12px"></div>'
    +'<div class="form-group"><label>PRIX PAYÉ ($)</label><input type="number" id="rt-price" step="0.01" placeholder="ex: 150" value="'+(f.price||'')+'"></div>'
    +'<div class="form-group"><label>STATUT</label><select id="rt-status">'+statusOpts+'</select></div>'
    +'<div class="form-group"><label>DATE DE PASSAGE (financé)</label><input type="date" id="rt-datefunded" value="'+(f.dateFunded||'')+'"></div>'
    +'<div class="form-group"><label>DATE DE CRAME (si cramé)</label><input type="date" id="rt-datecrame" value="'+(f.dateCrame||'')+'"></div>'
    +'<div class="form-group full"><label>NOTE (optionnel)</label><textarea id="rt-note" placeholder="Taille du compte, code promo utilisé...">'+(f.note||'')+'</textarea></div>'
    +'<div class="form-group full"><div style="font-size:10px;color:var(--muted);line-height:1.5">Les payouts s\'ajoutent ensuite depuis la liste, avec le bouton <b>+ 💵</b>. Un compte peut en recevoir plusieurs.</div></div>'
    +'<div class="form-group full" style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-primary" onclick="saveRent()" style="flex:1">💾 Enregistrer</button><button class="btn btn-ghost" onclick="closeModal()">Annuler</button></div>'
    +'</div>';
}
function toggleRentFirm(){var s=document.getElementById('rt-firm'),i=document.getElementById('rt-firm-custom');if(!s||!i)return;if(s.value==='Autre'){i.style.display='block';i.focus();}else i.style.display='none';}
function openRentModal(prefill){
  _editingRentId=prefill?prefill.id:null;
  var f=prefill||{date:today(),firm:'Lucid',status:'En cours'};
  document.getElementById('modal-title').textContent=_editingRentId?'MODIFIER LE COMPTE':'NOUVEAU COMPTE ACHETÉ';
  document.getElementById('modal-body').innerHTML=rentForm(f);
  document.getElementById('modal-overlay').classList.add('open');
}
function editRent(id){var a=getRent().find(function(x){return x.id===id;});if(a)openRentModal(a);}
function deleteRent(id){
  if(!confirm('Supprimer ce compte et ses payouts ?'))return;
  setRent(getRent().filter(function(x){return x.id!==id;}));toast('Compte supprimé');nav('rentability');
}
function saveRent(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  var firm=g('rt-firm')==='Autre'?(g('rt-firm-custom')||'Autre'):g('rt-firm');
  var list=getRent();
  if(_editingRentId){
    var i=list.findIndex(function(x){return x.id===_editingRentId;});
    if(i>-1){list[i].date=g('rt-date');list[i].firm=firm;list[i].price=g('rt-price')||'0';list[i].status=g('rt-status');list[i].note=g('rt-note');list[i].dateFunded=g('rt-datefunded')||'';list[i].dateCrame=g('rt-datecrame')||'';}
  }else{
    list.push({id:'rt'+uid(),date:g('rt-date')||today(),firm:firm,price:g('rt-price')||'0',status:g('rt-status')||'En cours',note:g('rt-note')||'',dateFunded:g('rt-datefunded')||'',dateCrame:g('rt-datecrame')||'',payouts:[]});
  }
  setRent(list);_editingRentId=null;closeModal();toast('Compte enregistré');nav('rentability');
}
function addPayout(id){
  var amt=prompt('Montant du payout reçu ($) :');
  if(amt===null)return;
  amt=parseFloat(amt);if(isNaN(amt)){alert('Montant invalide');return;}
  // Achat autonome (Rentabilité) ?
  var rlist=getRent();var r=rlist.find(function(x){return x.id===id;});
  if(r){
    if(!r.payouts)r.payouts=[];
    r.payouts.push({amount:amt,date:today()});
    if(r.status==='En cours')r.status='Financé';
    if(!r.dateFunded)r.dateFunded=today();
    setRent(rlist);toast('Payout de '+fmt$(amt)+' ajouté');nav(currentPage);return;
  }
  // Compte de trading ?
  var alist=DB.accounts;var a=alist.find(function(x){return x.id===id;});
  if(a){
    if(!a.payouts)a.payouts=[];
    a.payouts.push({amount:amt,date:today()});
    if(accStage(a)!=='Funded'){a.stage='Funded';a.status='Funded';if(!a.dateFunded)a.dateFunded=today();}
    DB.accounts=alist;toast('Payout de '+fmt$(amt)+' ajouté à '+a.name);nav(currentPage);return;
  }
  alert('Compte introuvable');
}

// ── COACH — VERDICTS HONNÊTES ────────────────────────────────────────────────
// Un moteur unique qui lit tes données et te dit la vérité : ce qui marche,
// ce qui te coûte de l'argent, et quoi faire. Conscient du volume : en dessous
// de 10 trades il refuse de conclure, entre 10 et 30 il nuance, au-delà il tranche.
function coachTier(n){return n<10?'none':n<30?'confirm':'firm';}
function coachCaveat(n){return n<30?' <span style="color:var(--muted)">(sur '+n+' trades — à confirmer)</span>':'';}
function _isWin(x){return x.result==='Win'||x.result==='Win Partiel';}
function _rr(x){return (typeof realizedR==='function')?realizedR(x):(parseFloat(x.plR)||0);}
function _grp(list){
  var n=list.length,wins=list.filter(_isWin).length;
  var pl=list.reduce(function(s,x){return s+(parseFloat(x.plDollar)||0);},0);
  var sumR=list.reduce(function(s,x){return s+_rr(x);},0);
  return {n:n,wins:wins,wr:n?Math.round(wins/n*100):0,pl:pl,exp:n?sumR/n:0};
}
function _V(level,icon,title,text,n,impact,scope){return {level:level,icon:icon,title:title,text:text,n:n||0,impact:impact||0,scope:scope||'trade'};}

function coachEngine(trades){
  trades=trades||DB.trades;
  var V=[];
  var N=trades.length;

  // 0) Volume global insuffisant
  if(N<10){
    V.push(_V('blue','📊','Continue à logger',
      'Tu as <b>'+N+' trade'+(N>1?'s':'')+'</b>. En dessous de 10, tout verdict serait du hasard. Vise <b>30+</b> pour des conclusions fiables — chaque trade renseigné rend ton journal plus tranchant.',N,9999,'data'));
    return V;
  }

  // 1) SETUPS — le meilleur à prioriser, le pire à corriger
  try{
    var rows=[];
    (typeof SETUPS!=='undefined'?SETUPS:[]).forEach(function(su){
      (typeof SETUP_TYPE!=='undefined'?SETUP_TYPE:['Continuation','Renversement']).forEach(function(st){
        var s=setupStats(su,st);if(s.n>=5)rows.push({su:su,st:st,s:s});
      });
    });
    rows.sort(function(a,b){return b.s.exp-a.s.exp;});
    if(rows.length){
      var best=rows[0],worst=rows[rows.length-1];
      if(worst.s.exp<-0.05&&worst.s.n>=8){
        V.push(_V('red','✂️','Mets ton '+worst.su+' '+worst.st+' en pause',
          'Il sort à <b style="color:var(--red)">'+worst.s.exp.toFixed(2)+'R par trade</b> ('+fmt$(Math.round(worst.s.pl))+' au total, WR '+worst.s.wr+'%). Sur '+worst.s.n+' trades, ce n\'est pas de la malchance : ce setup te fait perdre. Arrête-le ou revois tes conditions d\'entrée dessus.'+coachCaveat(worst.s.n),
          worst.s.n,Math.abs(worst.s.pl),'setup'));
      }
      if(best.s.exp>0.15&&best.s.n>=8&&best!==worst){
        V.push(_V('green','🎯','Ton '+best.su+' '+best.st+' porte ton compte',
          '<b style="color:var(--green)">'+best.s.exp.toFixed(2)+'R par trade</b> ('+fmt$(Math.round(best.s.pl))+', WR '+best.s.wr+'%). C\'est ton arme. Cherche à en prendre plus, quitte à sauter les setups plus faibles.'+coachCaveat(best.s.n),
          best.s.n,Math.abs(best.s.pl),'setup'));
      }
    }
  }catch(e){}

  // 2) RESPECT DU PLAN — souvent le verdict qui pique
  var pOui=trades.filter(function(x){return x.planRespected==='Oui';});
  var pNon=trades.filter(function(x){return x.planRespected==='Non';});
  if(pOui.length>=8&&pNon.length>=6){
    var gO=_grp(pOui),gN=_grp(pNon);
    if(gN.exp<gO.exp-0.3){
      V.push(_V('red','🎯','Ton problème, c\'est l\'exécution — pas la stratégie',
        'Quand tu respectes ton plan : <b style="color:var(--green)">'+gO.exp.toFixed(2)+'R</b> (WR '+gO.wr+'%). Quand tu ne le respectes pas : <b style="color:var(--red)">'+gN.exp.toFixed(2)+'R</b> (WR '+gN.wr+'%, '+fmt$(Math.round(gN.pl))+'). Ta stratégie est bonne ; c\'est toi qui la sabotes. Les trades hors-plan te coûtent de l\'argent — coupe-les.',
        gN.n,Math.abs(gN.pl),'plan'));
    }else if(gO.exp>0.1&&gO.n>=15){
      V.push(_V('green','✅','Ta discipline paie',
        'Quand tu respectes ton plan, tu es à <b style="color:var(--green)">'+gO.exp.toFixed(2)+'R</b> par trade. Continue exactement comme ça.'+coachCaveat(gO.n),gO.n,gO.pl,'plan'));
    }
  }

  // 3) ÉTAT ÉMOTIONNEL
  var eLow=trades.filter(function(x){var e=parseInt(x.emotionalState);return e&&e<=2;});
  var eHigh=trades.filter(function(x){var e=parseInt(x.emotionalState);return e&&e>=4;});
  if(eLow.length>=5&&eHigh.length>=5){
    var gL=_grp(eLow),gH=_grp(eHigh);
    if(gL.exp<gH.exp-0.3||gL.pl<0){
      V.push(_V(gL.pl<0?'red':'yellow','🧠','Ne trade pas quand tu n\'es pas dedans',
        'À froid (≤2/5) : <b style="color:'+(gL.pl<0?'var(--red)':'var(--yellow)')+'">'+gL.exp.toFixed(2)+'R</b>, '+fmt$(Math.round(gL.pl))+'. Concentré (4-5/5) : <b style="color:var(--green)">'+gH.exp.toFixed(2)+'R</b>. Ton mental se voit dans ton P&L. Quand t\'es à ≤2/5, ferme la plateforme.'+coachCaveat(gL.n),
        gL.n,Math.abs(gL.pl),'emotion'));
    }
  }

  // 4) RR VISÉ vs RÉALISÉ — coupes-tu trop tôt ?
  var wW=trades.filter(function(x){return _isWin(x)&&x.rrTarget&&x.rrActual;});
  if(wW.length>=10){
    var tgt=wW.reduce(function(s,x){return s+(parseFloat(x.rrTarget)||0);},0)/wW.length;
    var rea=wW.reduce(function(s,x){return s+Math.abs(parseFloat(x.rrActual)||0);},0)/wW.length;
    if(tgt>0&&rea<tgt*0.7){
      V.push(_V('yellow','📏','Tu vises '+tgt.toFixed(1)+'R mais tu réalises '+rea.toFixed(1)+'R',
        'Sur tes gagnants, tu encaisses en moyenne <b>'+rea.toFixed(1)+'R</b> alors que tu vises <b>'+tgt.toFixed(1)+'R</b>. Tu coupes avant la cible. Croise avec ta MAE/MFE : si le marché offrait plus, laisse courir (sorties partielles, trailing plus lâche).'+coachCaveat(wW.length),
        wW.length,0,'rr'));
    }
  }

  // 5) SESSION
  coachBestWorst(V,trades,'session',function(x){return (x.session||'').replace('Session ','')||'?';},'⏰','session');
  // 6) INSTRUMENT
  coachBestWorst(V,trades,'instrument',function(x){return x.instrument||'?';},'📈','instrument');

  // 7) BIAIS forcé
  var bOui=trades.filter(function(x){return x.biasCorrect==='Oui';});
  var bNon=trades.filter(function(x){return x.biasCorrect==='Non';});
  if(bOui.length>=8&&bNon.length>=6){
    var gBO=_grp(bOui),gBN=_grp(bNon);
    if(gBN.pl<0&&gBN.exp<gBO.exp-0.3){
      V.push(_V('yellow','🧭','Tu forces contre ton biais',
        'Quand ton biais est juste : '+gBO.exp.toFixed(2)+'R. Quand tu le forces (biais faux) : <b style="color:var(--red)">'+gBN.exp.toFixed(2)+'R</b>, '+fmt$(Math.round(gBN.pl))+'. Attends la confirmation de ton biais avant d\'entrer.'+coachCaveat(gBN.n),
        gBN.n,Math.abs(gBN.pl),'bias'));
    }
  }

  // 8) SÉRIE EN COURS
  var sorted=trades.slice().filter(function(x){return x.date;}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var streak=0;for(var i=0;i<sorted.length;i++){if(sorted[i].result==='Loss')streak++;else break;}
  if(streak>=3){
    V.push(_V('red','🛑',streak+' pertes d\'affilée',
      'Tu enchaînes <b>'+streak+' pertes</b>. Que ce soit le marché ou toi, la réponse est la même : <b>réduis ta taille de moitié</b> le temps de retrouver un trade propre, ou fais une pause. C\'est comme ça qu\'on protège un compte d\'une spirale.',
      streak,5000,'streak'));
  }

  // 9) RISQUE
  var risks=trades.map(function(x){return parseFloat(x.risk);}).filter(function(v){return !isNaN(v)&&v>0;});
  if(risks.length>=8){
    var avgR=risks.reduce(function(s,v){return s+v;},0)/risks.length;
    var maxR=Math.max.apply(null,risks),minR=Math.min.apply(null,risks);
    if(avgR>2){
      V.push(_V('red','⚖️','Ton risque moyen est trop élevé ('+avgR.toFixed(1)+'%)',
        'À '+avgR.toFixed(1)+'% par trade, une série de 5 pertes (ça arrive à tout le monde) te fait <b>-'+(avgR*5).toFixed(0)+'%</b>. Redescends à <b>0.5-1%</b> : tu survivras aux mauvaises passes, et c\'est la survie qui fait les comptes rentables sur la durée.',
        risks.length,4000,'risk'));
    }else if(maxR-minR>=2){
      V.push(_V('yellow','⚖️','Ton risque part dans tous les sens',
        'Tu passes de '+minR+'% à '+maxR+'% selon les trades. Un risque variable rend tes stats illisibles et laisse tes émotions décider de la taille. Fixe une règle claire (ex : 1% en A, 1.5% en A+) et tiens-la.',
        risks.length,1500,'risk'));
    }
  }

  // 10) SCALP
  try{
    var sc=scalpTotals(getScalps());
    if(sc.sessions>=5){
      if(sc.pl<0&&sc.wr>=55){
        V.push(_V('red','⚡','Scalp : tu gagnes souvent mais tu perds gros',
          'WR de <b>'+sc.wr+'%</b> mais P&L de <b style="color:var(--red)">'+fmt$(Math.round(sc.pl))+'</b>. Classique : tu prends tes gains trop tôt et tu laisses courir tes pertes. Ton problème n\'est pas la sélection, c\'est la gestion du risque par trade. Coupe tes perdants plus vite.',
          sc.sessions,Math.abs(sc.pl),'scalp'));
      }else if(sc.pl<0){
        V.push(_V('red','⚡','Ton scalp te coûte de l\'argent',
          '<b style="color:var(--red)">'+fmt$(Math.round(sc.pl))+'</b> sur '+sc.sessions+' sessions (WR '+sc.wr+'%). Si ça ne devient pas rentable, ce temps serait mieux investi sur tes setups ICT qui, eux, marchent.',
          sc.sessions,Math.abs(sc.pl),'scalp'));
      }else if(sc.pl>0){
        V.push(_V('green','⚡','Ton scalp est rentable',
          '<b style="color:var(--green)">+'+fmt$(Math.round(sc.pl)).replace('+','')+'</b> sur '+sc.sessions+' sessions, WR '+sc.wr+'%. Propre. Garde le même cadre et la même discipline de sortie.',
          sc.sessions,sc.pl,'scalp'));
      }
    }
  }catch(e){}

  // 11) OBJECTIF DU MOIS
  try{
    var now=new Date();var mo=now.getMonth()+1,yr=now.getFullYear();
    var obj=(DB.objectives||[]).find(function(o){return parseInt(o.month)===mo&&parseInt(o.year)===yr;});
    if(obj&&obj.plTarget){
      var target=parseFloat(obj.plTarget)||0;
      var mPfx=yr+'-'+String(mo).padStart(2,'0');
      var mpl=trades.filter(function(x){return (x.date||'').startsWith(mPfx);}).reduce(function(s,x){return s+(parseFloat(x.plDollar)||0);},0);
      try{mpl+=getScalps().filter(function(x){return (x.date||'').startsWith(mPfx);}).reduce(function(s,x){return s+(parseFloat(x.plDollar)||0);},0);}catch(e){}
      var dim=new Date(yr,mo,0).getDate(),dnow=now.getDate();
      var pace=dnow>0?mpl/dnow*dim:0;
      if(target>0){
        if(mpl>=target){
          V.push(_V('green','🏁','Objectif du mois atteint',
            'Tu es à <b style="color:var(--green)">'+fmt$(Math.round(mpl))+'</b> pour un objectif de '+fmt$(target).replace('+','')+'. Ne relâche pas la discipline pour "sécuriser" — continue à trader comme tu l\'as fait.',0,0,'objectif'));
        }else if(pace>=target){
          V.push(_V('green','📈','Tu es sur la bonne trajectoire',
            'À ton rythme ('+fmt$(Math.round(mpl))+' au jour '+dnow+'), tu finirais vers <b>'+fmt$(Math.round(pace))+'</b> — au-dessus de ta cible de '+fmt$(target).replace('+','')+'. Tiens le cap.',0,0,'objectif'));
        }else{
          V.push(_V('yellow','📉','Rythme en dessous de ton objectif',
            'À ton rythme actuel tu finirais vers <b style="color:var(--yellow)">'+fmt$(Math.round(pace))+'</b>, sous ta cible de '+fmt$(target).replace('+','')+'. Ne force pas pour rattraper (c\'est le piège) : la cible se rattrape avec de bons trades, pas avec plus de trades.',0,0,'objectif'));
        }
      }
    }
  }catch(e){}

  return V;
}

// Meilleur vs pire d'une dimension (session, instrument…)
function coachBestWorst(V,trades,key,labelFn,icon,scope){
  var map={};
  trades.forEach(function(x){var k=labelFn(x);if(!map[k])map[k]=[];map[k].push(x);});
  var rows=Object.keys(map).map(function(k){return {k:k,g:_grp(map[k])};}).filter(function(r){return r.g.n>=6;});
  if(rows.length<2)return;
  rows.sort(function(a,b){return b.g.exp-a.g.exp;});
  var best=rows[0],worst=rows[rows.length-1];
  if(worst.g.pl<0&&worst.g.exp<best.g.exp-0.3){
    V.push(_V('yellow',icon,'Ton point faible : '+worst.k,
      worst.k+' te coûte <b style="color:var(--red)">'+fmt$(Math.round(worst.g.pl))+'</b> ('+worst.g.exp.toFixed(2)+'R, WR '+worst.g.wr+'%) alors que '+best.k+' te rapporte ('+best.g.exp.toFixed(2)+'R). Concentre-toi sur '+best.k+', ou comprends ce qui cloche sur '+worst.k+'.'+coachCaveat(worst.g.n),
      worst.g.n,Math.abs(worst.g.pl),scope));
  }
}

function coachSort(list){
  var order={red:0,yellow:1,green:2,blue:3};
  return list.slice().sort(function(a,b){return (order[a.level]-order[b.level])||(b.impact-a.impact);});
}
// Bloc synthétique (Dashboard) : les N plus importants
function coachBlockHTML(trades,limit,opts){
  opts=opts||{};

  if(!list.length)return opts.silentIfEmpty?'':'';
  if(limit)list=list.slice(0,limit);
  var title=opts.title!==undefined?opts.title:'🧠 COACH — CE QUI COMPTE MAINTENANT';

// ── HELPERS COMPTE (cycle de vie unifié) ─────────────────────────────────────
// Un compte porte à la fois le trading (taille, DD, trades) ET le business
// (prix payé, statut, payouts). S'il a un prix, il apparaît tout seul en Rentabilité.
function accStage(a){return a.stage||(a.status==='Funded'?'Funded':(a.status==='Échoué'||a.status==='Cramé')?'Cramé':'P1');}
function accPhases(a){return parseInt(a.phases)||1;}
function accPurchased(a){return (parseFloat(a.price)||0)>0;}
function accPL(a){
  var pl=DB.trades.filter(function(t){return t.account===a.name;}).reduce(function(s,t){return s+(parseFloat(t.plDollar)||0);},0);
  try{pl+=scalpAccountPL(a.name);}catch(e){}
  return pl;
}
function accCurrentTarget(a){
  var st=accStage(a);
  if(st==='P1')return parseFloat(a.targetP1)||0;
  if(st==='P2')return parseFloat(a.targetP2)||0;
  if(st==='Funded')return parseFloat(a.payoutTarget)||0;
  return 0;
}
function accStageLabel(a){return {P1:'🎯 Phase 1',P2:'🎯 Phase 2',Funded:'💰 Funded',Cramé:'💀 Cramé'}[accStage(a)]||'🎯 Phase 1';}
function accStageColor(a){return {P1:'var(--yellow)',P2:'var(--yellow)',Funded:'var(--green)',Cramé:'var(--red)'}[accStage(a)]||'var(--yellow)';}
function accPayouts(a){return (a.payouts||[]).reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0);}

// Vue unifiée pour la Rentabilité : comptes achetés + achats autonomes (legacy)
function allPurchasedItems(){
  var out=[];
  DB.accounts.forEach(function(a){
    if(!accPurchased(a))return;
    var st=accStage(a);
    out.push({id:a.id,source:'account',firm:a.firm||'Autre',price:a.price,
      date:a.dateBought||a.date||'',
      status:st==='Funded'?'Financé':st==='Cramé'?'Cramé':'En cours',
      dateFunded:a.dateFunded||'',dateCrame:a.dateCrame||'',
      payouts:a.payouts||[],name:a.name});
  });
  getRent().forEach(function(r){
    out.push({id:r.id,source:'rent',firm:r.firm||'Autre',price:r.price,date:r.date||'',
      status:r.status||'En cours',dateFunded:r.dateFunded||'',dateCrame:r.dateCrame||'',
      payouts:r.payouts||[],name:r.firm});
  });
  return out;
}

}
function toggleAcPhases(){var s=document.getElementById('ac-phases'),w=document.getElementById('ac-p2-wrap');if(s&&w)w.style.display=(s.value==='2')?'block':'none';}

function saveAccount(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  var prev=_editingId?DB.accounts.find(function(x){return x.id===_editingId;}):null;
  var stage=g('ac-stage')||'P1';
  var phases=parseInt(g('ac-phases'))||1;
  // Statut legacy synchronisé (compat avec le reste de l'app)
  var legacyStatus=stage==='Funded'?'Funded':stage==='Cramé'?'Échoué':'Actif';
  var a={
    id:_editingId||uid(),
    name:g('ac-name')||'',
    firm:g('ac-firm')||'Apex',
    group:g('ac-group')||'Prop Firm',
    size:g('ac-size')||50000,
    phases:phases,
    stage:stage,
    type:accStageLabel({stage:stage}).replace(/^[^ ]+ /,''),
    targetP1:g('ac-targetp1')||'',
    targetP2:g('ac-targetp2')||'',
    payoutTarget:g('ac-payouttarget')||'',
    maxDrawdown:g('ac-dd')||2500,
    dailyLoss:g('ac-dl')||1500,
    price:g('ac-price')||'',
    dateBought:g('ac-datebought')||(prev&&prev.dateBought)||'',
    dateFunded:(prev&&prev.dateFunded)||'',
    dateCrame:(prev&&prev.dateCrame)||'',
    payouts:(prev&&prev.payouts)||[],
    archived:prev?prev.archived:false,
    status:legacyStatus
  };
  // Dates de cycle de vie auto
  if(a.price&&!a.dateBought)a.dateBought=today();
  if(stage==='Funded'&&!a.dateFunded)a.dateFunded=today();
  if(stage==='Cramé'&&!a.dateCrame)a.dateCrame=today();
  if(_editingId){DB.updateAccount(_editingId,a);}else{DB.addAccount(a);}
  closeModal();
  toast(accPurchased(a)?'Compte enregistré — suivi en Rentabilité activé':'Compte enregistré');
  nav('accounts');
}

// ── PAGE COMPTES ─────────────────────────────────────────────────────────────
function accounts(){
  var allAccs=DB.accounts;
  var active=allAccs.filter(function(a){return !a.archived;});
  var archived=allAccs.filter(function(a){return a.archived;});

  function renderCard(a,isArchived){
    var st=accStage(a);
    var plTrades=Math.round(DB.trades.filter(function(t){return t.account===a.name;}).reduce(function(s,t){return s+(parseFloat(t.plDollar)||0);},0));
    var plScalp=Math.round(scalpAccountPL(a.name));
    var plAuto=plTrades+plScalp;
    var size=parseFloat(a.size)||50000;
    var bal=size+plAuto;
    var maxDD=parseFloat(a.maxDrawdown)||2500;
    var ddPct=plAuto<0?Math.min(Math.abs(plAuto)/maxDD*100,100):0;
    var aT=DB.trades.filter(function(t){return t.account===a.name;});
    var wins=aT.filter(function(t){return t.result==='Win'||t.result==='Win Partiel';}).length;
    var sc=accStageColor(a);

    // Barre d'objectif selon l'étape
    var goalBar='';
    var target=accCurrentTarget(a);
    if(st!=='Cramé'&&target>0){
      var gp=Math.min(Math.max(plAuto/target*100,0),100);
      var reste=target-plAuto;
      var lbl=st==='Funded'?'Objectif payout':'Objectif '+(st==='P2'?'Phase 2':'Phase 1');
      goalBar='<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px"><span>'+lbl+' : '+fmt$(target).replace('+','')+'</span><span>'+(reste>0?'reste '+fmt$(reste).replace('+',''):'✓ atteint').toString()+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+gp+'%;background:'+(gp>=100?'var(--green)':'var(--accent)')+'"></div></div></div>';
    }

    var payoutTot=accPayouts(a);
    var extraStats=[];
    if(accPurchased(a))extraStats.push(['Prix payé',fmt$(-(parseFloat(a.price)||0)).replace('−','-'),'var(--red)']);
    if(payoutTot>0)extraStats.push(['Payouts reçus',fmt$(payoutTot),'var(--green)']);

    var stats=[['Taille','$'+size.toLocaleString(),'var(--text)'],
      ['Balance calculée','$'+bal.toLocaleString(),bal>=size?'var(--green)':'var(--red)'],
      ['P&L réalisé',fmt$(plAuto),plAuto>=0?'var(--green)':'var(--red)']]
      .concat(plScalp!==0?[['· dont scalp',fmt$(plScalp),plScalp>=0?'var(--green)':'var(--red)']]:[])
      .concat(extraStats)
      .concat([['Drawdown actuel',fmt$(Math.min(0,plAuto)),plAuto<0?'var(--red)':'var(--muted)'],
      ['DD max autorisé',fmt$(-maxDD),'var(--muted)'],
      ['Daily loss max',fmt$(-(parseFloat(a.dailyLoss)||1500)),'var(--muted)'],
      ['Trades',aT.length,'var(--text)'],
      ['Win rate',aT.length?pct(wins,aT.length)+'%':'—','var(--accent)']])
      .map(function(arr){return '<div class="acc-stat"><span class="acc-stat-label">'+arr[0]+'</span><span class="acc-stat-value" style="color:'+arr[2]+'">'+arr[1]+'</span></div>';}).join('');

    var ddBar=plAuto<0?'<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:4px"><span>Drawdown utilisé</span><span>'+ddPct.toFixed(0)+'%</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+ddPct+'%;background:'+(ddPct>80?'var(--red)':ddPct>50?'var(--yellow)':'var(--green)')+'"></div></div></div>':'';

    var payoutBtn=(st==='Funded'&&!isArchived)?'<button class="btn btn-ghost btn-sm" onclick="addPayout(\''+a.id+'\')" title="Ajouter un payout">+ 💵</button>':'';
    var actionBtns=isArchived
      ?'<button class="btn btn-ghost btn-sm" onclick="unarchiveAccount(\''+a.id+'\')" title="Réactiver">↩</button>'
      :payoutBtn+'<button class="btn btn-ghost btn-sm" onclick="editAccount(\''+a.id+'\')">✏️</button><button class="btn btn-ghost btn-sm" onclick="archiveAccount(\''+a.id+'\')" title="Archiver">📦</button><button class="btn btn-danger btn-sm" onclick="deleteAccount(\''+a.id+'\')">🗑</button>';

    return '<div class="acc-card"'+(isArchived?' style="opacity:0.6"':(st==='Cramé'?' style="opacity:0.75"':''))+'>'
      +'<div class="flex-between" style="margin-bottom:14px">'
      +'<div><div style="font-size:14px;font-weight:800">'+a.name+(isArchived?' <span style="font-size:9px;color:var(--muted)">(archivé)</span>':'')+'</div><div style="font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:2px">'+a.firm+' · '+accPhases(a)+' phase'+(accPhases(a)>1?'s':'')+'</div></div>'
      +'<div class="flex-row"><span class="badge" style="background:'+sc+'20;color:'+sc+'">'+accStageLabel(a)+'</span>'+actionBtns+'</div>'
      +'</div>'+stats+goalBar+ddBar+'</div>';
  }

  function section(title,list,sub){
    if(!list.length)return '';
    return '<div style="margin-bottom:8px;margin-top:18px"><div style="font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted)">'+title+' <span style="color:var(--faint2,var(--border2))">('+list.length+')</span></div>'
      +(sub?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+sub+'</div>':'')+'</div>'
      +'<div class="grid-2">'+list.map(function(a){return renderCard(a,false);}).join('')+'</div>';
  }

  var validation=active.filter(function(a){var s=accStage(a);return s==='P1'||s==='P2';});
  var funded=active.filter(function(a){return accStage(a)==='Funded';});
  var crame=active.filter(function(a){return accStage(a)==='Cramé';});

  var body='';
  if(!active.length)body='<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🏦</div><p>Aucun compte — clique sur + Compte</p></div>';
  else{
    body=section('🎯 EN VALIDATION',validation,'Objectif : atteindre la cible pour passer le compte')
      +section('💰 FUNDED',funded,'Objectif : générer du profit à retirer en payout')
      +section('💀 CRAMÉS',crame,'');
  }

  var archivedSection='';
  if(archived.length){
    var archivedCards=archived.map(function(a){return renderCard(a,true);}).join('');
    archivedSection='<div style="margin-top:20px"><div onclick="toggleArchivedAccounts()" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--s1);border:1px solid var(--border);border-radius:10px"><span id="archived-accounts-arrow" style="font-size:12px;color:var(--accent)">▸</span><div style="font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted)">COMPTES ARCHIVÉS ('+archived.length+')</div></div><div id="archived-accounts-content" style="display:none;margin-top:12px"><div class="grid-2">'+archivedCards+'</div></div></div>';
  }

  return '<div class="flex-between" style="margin-bottom:6px"><div><div class="page-title">🏦 COMPTES PROP</div><div class="page-sub">VALIDATION · FUNDED · LIÉ À LA RENTABILITÉ</div></div><button class="btn btn-primary btn-sm" onclick="openAddAccount()">+ Compte</button></div>'
    +body+archivedSection;
}

// ── STATS PAR SETUP ──────────────────────────────────────────────────────────
function setupStats(setup,setupType){
  var t=DB.trades.filter(function(x){
    if(setup&&x.setup!==setup)return false;
    if(setupType&&x.setupType!==setupType)return false;
    return true;
  });
  var n=t.length;
  if(!n)return {n:0,wr:0,pl:0,avgR:0,exp:0,wins:0,losses:0,plan:0,best:0,worst:0};
  var wins=t.filter(function(x){return x.result==='Win'||x.result==='Win Partiel';}).length;
  var losses=t.filter(function(x){return x.result==='Loss';}).length;
  var pl=t.reduce(function(s,x){return s+(parseFloat(x.plDollar)||0);},0);
  var rs=t.map(function(x){return parseFloat(x.rrActual)||parseFloat(x.plR)||0;});
  var sumR=rs.reduce(function(s,r){return s+r;},0);
  var plan=t.filter(function(x){return x.planRespected==='Oui';}).length;
  var pls=t.map(function(x){return parseFloat(x.plDollar)||0;});
  return {
    n:n,wr:Math.round(wins/n*100),pl:pl,avgR:sumR/n,exp:sumR/n,
    wins:wins,losses:losses,plan:Math.round(plan/n*100),
    best:Math.max.apply(null,pls),worst:Math.min.apply(null,pls)
  };
}

function pbStatsStrip(setup,setupType){
  var s=setupStats(setup,setupType);
  if(!s.n)return '<div style="padding:8px 10px;background:var(--s2);border-radius:8px;margin-bottom:10px;font-size:10px;color:var(--muted);text-align:center">Aucun trade enregistré sur ce setup — les stats apparaîtront ici</div>';
  var plc=s.pl>0?'var(--green)':s.pl<0?'var(--red)':'var(--muted)';
  var wrc=s.wr>=60?'var(--green)':s.wr>=45?'var(--yellow)':'var(--red)';
  var expc=s.exp>0?'var(--green)':'var(--red)';
  var cell=function(l,v,c){return '<div style="text-align:center;flex:1;min-width:52px"><div style="font-size:7px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:2px">'+l+'</div><div style="font-size:13px;font-weight:900;font-family:monospace;color:'+(c||'var(--text)')+'">'+v+'</div></div>';};
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;padding:9px 6px;background:var(--s2);border:1px solid var(--border);border-radius:8px;margin-bottom:10px">'
    +cell('TRADES',s.n)
    +cell('WIN RATE',s.wr+'%',wrc)
    +cell('P&L',fmt$(Math.round(s.pl)),plc)
    +cell('EXPECT.',(s.exp>0?'+':'')+s.exp.toFixed(2)+'R',expc)
    +cell('PLAN OK',s.plan+'%',s.plan>=80?'var(--green)':'var(--yellow)')
    +'</div>';
}

// ── TABLEAU DE BORD DES SETUPS ───────────────────────────────────────────────
function pbSetupTable(){
  var rows=[];
  SETUPS.forEach(function(su){
    SETUP_TYPE.forEach(function(st){
      var s=setupStats(su,st);
      if(s.n)rows.push({su:su,st:st,s:s});
    });
  });
  if(!rows.length)return '<div class="card" style="margin-bottom:14px"><div class="card-title">PERFORMANCE DES SETUPS</div><div style="font-size:11px;color:var(--muted);text-align:center;padding:14px">Enregistre des trades pour voir quel setup te rapporte réellement.</div></div>';
  rows.sort(function(a,b){return b.s.exp-a.s.exp;});
  var best=rows[0],worst=rows[rows.length-1];
  var html=rows.map(function(r,i){
    var sc=SETUP_COLORS[r.su]||'#525278';
    var plc=r.s.pl>0?'var(--green)':r.s.pl<0?'var(--red)':'var(--muted)';
    var expc=r.s.exp>0?'var(--green)':'var(--red)';
    var tag=i===0&&r.s.exp>0?'<span class="badge" style="background:rgba(0,212,106,0.15);color:var(--green);margin-left:6px">TON ARME</span>'
      :(r===worst&&r.s.exp<0?'<span class="badge" style="background:rgba(155,93,229,0.15);color:var(--red);margin-left:6px">À REVOIR</span>':'');
    return '<tr>'
      +'<td><span class="badge" style="background:'+sc+'20;color:'+sc+'">'+r.su+'</span> <span style="font-size:10px;color:var(--muted)">'+r.st+'</span>'+tag+'</td>'
      +'<td style="font-family:monospace">'+r.s.n+'</td>'
      +'<td style="font-family:monospace;color:'+(r.s.wr>=60?'var(--green)':r.s.wr>=45?'var(--yellow)':'var(--red)')+'">'+r.s.wr+'%</td>'
      +'<td style="font-family:monospace;font-weight:800;color:'+plc+'">'+fmt$(Math.round(r.s.pl))+'</td>'
      +'<td style="font-family:monospace;font-weight:800;color:'+expc+'">'+(r.s.exp>0?'+':'')+r.s.exp.toFixed(2)+'R</td>'
      +'<td style="font-family:monospace;color:var(--muted)">'+r.s.plan+'%</td>'
      +'</tr>';
  }).join('');
  var verdict='';
  if(best&&best.s.exp>0&&worst&&worst.s.exp<0&&best!==worst){
    verdict='<div style="margin-top:12px;padding:10px;background:var(--s2);border-left:2px solid var(--accent);border-radius:6px;font-size:11px;color:var(--text);line-height:1.6">'
      +'<b style="color:var(--accent)">Lecture :</b> ton <b>'+best.su+' '+best.st+'</b> sort à <b style="color:var(--green)">'+best.s.exp.toFixed(2)+'R</b> par trade, ton <b>'+worst.su+' '+worst.st+'</b> à <b style="color:var(--red)">'+worst.s.exp.toFixed(2)+'R</b>. '
      +'Sur '+worst.s.n+' trade'+(worst.s.n>1?'s':'')+', c\'est encore court pour conclure — mais si la tendance tient, la question à te poser est : est-ce le setup qui est mauvais, ou mon exécution dessus ?</div>';
  }
  return '<div class="card" style="margin-bottom:14px"><div class="card-title">PERFORMANCE RÉELLE DES SETUPS — CLASSÉS PAR ESPÉRANCE</div>'
    +'<div style="overflow-x:auto"><table class="pb-table"><thead><tr><th>SETUP</th><th>N</th><th>WR</th><th>P&L</th><th>ESPÉRANCE</th><th>PLAN</th></tr></thead><tbody>'+html+'</tbody></table></div>'
    +verdict+'</div>';
}

// ── ÉDITION ──────────────────────────────────────────────────────────────────
function pbToggleEdit(){
  if(pbEdit)pbSnapshot('Modification du '+new Date().toLocaleDateString('fr-FR'));
  pbEdit=!pbEdit;nav('playbook');
}
function pbSnapshot(note){
  var pb=getPlaybook();var h=pbHist();
  var last=h[0];
  if(last&&JSON.stringify(last.snapshot)===JSON.stringify(pb.sections))return;
  h.unshift({v:(h.length?h[0].v:0)+1,date:new Date().toISOString(),note:note||'',snapshot:JSON.parse(JSON.stringify(pb.sections))});
  DB._s('tj_playbook_hist',h.slice(0,20));
}
function pbSaveText(sid,idx,field,el){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});if(!s)return;
  if(idx==='_title')s.title=el.value;
  else if(idx==='_icon')s.icon=el.value;
  else if(String(idx).indexOf('_cell')===0){var parts=String(idx).split(':');s.items[parseInt(parts[1])].cells[parseInt(parts[2])]=el.value;}
  else s.items[idx][field]=el.value;
  savePlaybook(pb);
}
function pbSetColor(sid,idx,color){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});if(!s)return;
  s.items[idx].color=color;savePlaybook(pb);nav('playbook');
}
function pbSetLink(sid,which,val){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});if(!s)return;
  s[which]=val;savePlaybook(pb);nav('playbook');
}
function pbAddItem(sid){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});if(!s)return;
  if(s.type==='table')s.items.push({cells:s.cols.map(function(){return '';}),color:'var(--accent)'});
  else if(s.type==='kv')s.items.push({label:'',text:'',color:'var(--accent)'});
  else s.items.push({text:'',color:'var(--accent)'});
  savePlaybook(pb);nav('playbook');
}
function pbDelItem(sid,idx){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});if(!s)return;
  s.items.splice(idx,1);savePlaybook(pb);nav('playbook');
}
function pbMoveItem(sid,idx,dir){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});if(!s)return;
  var j=idx+dir;if(j<0||j>=s.items.length)return;
  var tmp=s.items[idx];s.items[idx]=s.items[j];s.items[j]=tmp;
  savePlaybook(pb);nav('playbook');
}
function pbAddSection(type){
  var pb=getPlaybook();
  var s={id:'s'+uid(),icon:'📐',title:'NOUVELLE SECTION',type:type||'rules',setup:'',setupType:'',items:[]};
  if(type==='table'){s.cols=['SETUP','RISQUE','R:R'];s.title='NOUVEAU TABLEAU';}
  pb.sections.push(s);savePlaybook(pb);nav('playbook');
}
function pbDelSection(sid){
  var pb=getPlaybook();var s=pb.sections.find(function(x){return x.id===sid;});
  if(!confirm('Supprimer la section « '+(s?s.title:'')+' » ?'))return;
  pb.sections=pb.sections.filter(function(x){return x.id!==sid;});savePlaybook(pb);nav('playbook');
}
function pbMoveSection(sid,dir){
  var pb=getPlaybook();var i=pb.sections.findIndex(function(x){return x.id===sid;});
  var j=i+dir;if(i<0||j<0||j>=pb.sections.length)return;
  var tmp=pb.sections[i];pb.sections[i]=pb.sections[j];pb.sections[j]=tmp;
  savePlaybook(pb);nav('playbook');
}
function pbToggleHist(){pbShowHist=!pbShowHist;nav('playbook');}
function pbRestore(v){
  var h=pbHist();var e=h.find(function(x){return x.v===v;});if(!e)return;
  if(!confirm('Restaurer la version '+v+' du '+new Date(e.date).toLocaleDateString('fr-FR')+' ?\n\nTa version actuelle sera archivée avant.'))return;
  pbSnapshot('Avant restauration v'+v);
  var pb=getPlaybook();pb.sections=JSON.parse(JSON.stringify(e.snapshot));savePlaybook(pb);
  toast('Playbook restauré en version '+v);nav('playbook');
}
function pbResetDefault(){
  if(!confirm('Revenir au playbook d\'origine ?\n\nTa version actuelle sera archivée et restera restaurable.'))return;
  pbSnapshot('Avant réinitialisation');
  DB._s('tj_playbook',PLAYBOOK_DEFAULT());toast('Playbook réinitialisé');nav('playbook');
}
function pbExportMD(){
  var pb=getPlaybook();
  var out='# PLAYBOOK — Trading Journal\n\n_Mis à jour le '+new Date(pb.updated).toLocaleString('fr-FR')+'_\n\n';
  pb.sections.forEach(function(s){
    out+='## '+(s.icon||'')+' '+s.title+'\n\n';
    if(s.setup){var st=setupStats(s.setup,s.setupType);
      if(st.n)out+='> '+st.n+' trades · WR '+st.wr+'% · P&L '+Math.round(st.pl)+'$ · espérance '+st.exp.toFixed(2)+'R\n\n';}
    if(s.type==='table'){
      out+='| '+s.cols.join(' | ')+' |\n|'+s.cols.map(function(){return '---';}).join('|')+'|\n';
      s.items.forEach(function(it){out+='| '+it.cells.join(' | ')+' |\n';});out+='\n';
    }else if(s.type==='kv'){
      s.items.forEach(function(it){out+='- **'+it.label+'** : '+it.text+'\n';});out+='\n';
    }else{
      s.items.forEach(function(it){out+='- '+it.text+'\n';});out+='\n';
    }
  });
  var blob=new Blob([out],{type:'text/markdown;charset=utf-8'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');
  a.href=url;a.download='playbook-'+new Date().toISOString().split('T')[0]+'.md';a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast('Playbook exporté en Markdown');
}

      }).join('');

      }).join('');
    }

  }else{

  var stats=(!pbEdit&&s.setup)?pbStatsStrip(s.setup,s.setupType):'';

    ${QUALITY.map(q=>`<option ${f.quality===q?'selected':''}>${q}</option>`).join('')}
  </select></div>
  <div class="form-group"><label>R:R RÉEL (ce que tu as eu)</label><input type="number" id="f-rra" step="0.1" placeholder="ex: 2.5" value="${f.rrActual||''}"></div>
  <div class="form-group"><label>P&L EN R (multiple du risque)</label><input type="number" id="f-plr" step="0.1" placeholder="ex: +1.5 ou -1" value="${f.plR||''}"></div>
  <div class="form-group full"><label>P&L EN $ (montant réalisé)</label><input type="number" id="f-pld" step="1" placeholder="ex: 350 ou -100" value="${f.plDollar||''}"></div>

  <div class="section-title">🧠 PSYCHOLOGIE</div>
  <div class="form-group"><label>PLAN RESPECTÉ ?</label><select id="f-plan">
    ${PLAN_RESP.map(pr=>`<option ${f.planRespected===pr?'selected':''}>${pr}</option>`).join('')}
  </select></div>
  <div class="form-group"><label>BIAIS PRÉ-SESSION CORRECT ?</label><select id="f-biascorrect">
    <option ${(f.biasCorrect||'N/A')==='Oui'?'selected':''}>Oui</option>
    <option ${(f.biasCorrect||'N/A')==='Non'?'selected':''}>Non</option>
    <option ${(f.biasCorrect||'N/A')==='N/A'?'selected':''}>N/A</option>
  </select></div>
  <div class="form-group full"><label>ÉTAT ÉMOTIONNEL AVANT LE TRADE (1 = Très mauvais · 5 = Excellent)</label>
    <div class="emotion-row">
      ${['1','2','3','4','5'].map(n=>`<div class="emo-btn ${emo===n?'active':''}" onclick="selectEmo('${n}')">${['😰','😟','😐','🙂','😊'][parseInt(n)-1]} ${n}</div>`).join('')}
    </div>
    <input type="hidden" id="f-emo" value="${emo}">
  </div>

  <div class="section-title">✅ CONFLUENCES PRÉSENTES</div>
  <div class="form-group full">
    <div class="check-group">
      ${CONFLUENCES.map(c=>`<label class="check-item"><input type="checkbox" id="cf-${c.k}" ${conf[c.k]?'checked':''}><span>${c.l}</span></label>`).join('')}
    </div>
  </div>

  <div class="section-title">✂️ MAE / MFE (RECOMMANDÉ — débloque l'analyse des sorties)</div>
  <div class="form-group full"><div style="font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:6px">MAE = pire drawdown pendant le trade · MFE = meilleur profit atteint avant la sortie. Saisis-les <b>en R</b> (le plus simple), ou en prix — l'app convertit automatiquement.</div></div>
  <div class="form-group"><label>MAE EN R (ex: 0.6)</label><input type="number" id="f-maeR" step="0.1" placeholder="drawdown max en R" value="${f.maeR||''}" oninput="maeMfePreview()"></div>
  <div class="form-group"><label>MFE EN R (ex: 2.4)</label><input type="number" id="f-mfeR" step="0.1" placeholder="profit max en R" value="${f.mfeR||''}" oninput="maeMfePreview()"></div>
  <div class="form-group"><label>PRIX MAE (optionnel)</label><input type="number" id="f-mae" step="0.25" placeholder="Pire prix atteint" value="${f.maeprice||''}" oninput="maeMfePreview()"></div>
  <div class="form-group"><label>PRIX MFE (optionnel)</label><input type="number" id="f-mfe" step="0.25" placeholder="Meilleur prix atteint" value="${f.mfeprice||''}" oninput="maeMfePreview()"></div>
  <div class="form-group full"><div id="mae-preview" style="font-size:11px;color:var(--muted);padding:8px 10px;background:var(--s2);border-radius:8px;display:none"></div></div>

  <div class="section-title">TAGS PERSONNALISES</div>
  <div class="form-group full"><label>TAGS (virgules : NFP, London Raid...)</label>
    <input type="text" id="f-tags" placeholder="NFP, London Raid, Trending" value="${(f.tags||[]).join(', ')}">
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${['NFP','CPI','FOMC','London Raid','NY AM','NY PM','Trending','Range'].map(function(tg){return '<span onclick="addTag(\'' + tg + '\')" style="cursor:pointer;padding:3px 8px;border-radius:12px;font-size:9px;background:var(--s2);border:1px solid var(--border);color:var(--muted)">+' + tg + '</span>';}).join('')}</div>
  </div>

  <div class="section-title">📸 SCREENSHOT & NOTES</div>
  <div class="form-group full"><label>URL SCREENSHOT (TradingView, Imgur...)</label><input type="url" id="f-sc" placeholder="https://..." value="${f.screenshotUrl||''}"></div>
  <div class="form-group full"><label>NOTES PRÉ-TRADE</label><textarea id="f-notes" placeholder="Contexte, confluences, raisonnement...">${f.notes||''}</textarea></div>
  <div class="form-group full"><label>COMMENTAIRE POST-TRADE</label><textarea id="f-ptc" placeholder="Leçon retenue, erreurs, ce que j'aurais dû faire...">${f.postTradeComment||''}</textarea></div>
</div>
<div class="modal-footer">
  <button class="btn btn-ghost" onclick="closeModal()" style="flex:1">Annuler</button>
  <button class="btn btn-primary" onclick="saveTrade()" style="flex:2">Enregistrer ✓</button>
</div>`;
}
function selectEmo(n){document.getElementById('f-emo').value=n;document.querySelectorAll('.emo-btn').forEach((b,i)=>b.classList.toggle('active',String(i+1)===n));}
function getSelectedAccounts(){
  var cbs=document.querySelectorAll('.trade-acct-cb:checked');
  var accts=[];
  cbs.forEach(function(cb){accts.push(cb.value);});
  return accts.length?accts:[''];
}
function toggleCustomInstr(){
  var sel=document.getElementById('f-instr');
  var inp=document.getElementById('f-instr-custom');
  if(!sel||!inp)return;
  if(sel.value==='Autre'){inp.style.display='block';inp.focus();}
  else{inp.style.display='none';}
}
function toggleCustomTF(which){
  var sel=document.getElementById('f-tf'+which);
  var inp=document.getElementById('f-tf'+which+'-custom');
  if(!sel||!inp)return;
  if(sel.value==='Autre'){inp.style.display='block';inp.focus();}
  else{inp.style.display='none';}
}
function maeMfePreview(){
  var el=document.getElementById('mae-preview');if(!el)return;
  var g=function(id){var e=document.getElementById(id);return e?e.value:'';};
  var maeR=parseFloat(g('f-maeR')),mfeR=parseFloat(g('f-mfeR'));
  var entry=parseFloat(g('f-entry')),sl=parseFloat(g('f-sl'));
  var bias=g('f-bias')||'Long',isLong=(bias==='Long');
  var risk=(entry&&sl)?Math.abs(entry-sl):0;
  var parts=[];
  // Priorité aux R directs, sinon conversion des prix
  if(isNaN(maeR)&&risk&&g('f-mae')){var m=parseFloat(g('f-mae'));maeR=Math.abs(isLong?(entry-m)/risk:(m-entry)/risk);}
  if(isNaN(mfeR)&&risk&&g('f-mfe')){var f=parseFloat(g('f-mfe'));mfeR=isLong?(f-entry)/risk:(entry-f)/risk;}
  if(!isNaN(maeR))parts.push('Drawdown max : <b style="color:var(--red)">-'+Math.abs(maeR).toFixed(2)+'R</b>');
  if(!isNaN(mfeR))parts.push('Potentiel atteint : <b style="color:var(--green)">+'+mfeR.toFixed(2)+'R</b>');
  if(!isNaN(maeR)&&!isNaN(mfeR)&&mfeR>0){
    var plR=parseFloat(g('f-plr'));
    if(!isNaN(plR)&&plR>0)parts.push('Capture : <b style="color:var(--accent)">'+Math.round(plR/mfeR*100)+'%</b> du mouvement');
  }
  if(parts.length){el.style.display='block';el.innerHTML=parts.join(' &nbsp;·&nbsp; ');}
  else{el.style.display='none';}
}
function saveTrade(){
  var conf={};CONFLUENCES.forEach(c=>{conf[c.k]=(document.getElementById('cf-'+c.k)||{}).checked||false;});
  var rawDate=(document.getElementById('f-date')||{}).value||today();
  var dateOnly=rawDate.includes('T')?rawDate.split('T')[0]:rawDate;
  var t={
    id:_editingId||uid(),
    date:rawDate,dateOnly,
    exitTime:(document.getElementById('f-exittime')||{}).value||'',
    accounts:getSelectedAccounts(),account:getSelectedAccounts()[0]||'',
    session:(document.getElementById('f-session')||{}).value||'Session NY',
    instrument:((document.getElementById('f-instr')||{}).value==='Autre')?((document.getElementById('f-instr-custom')||{}).value||'Autre'):((document.getElementById('f-instr')||{}).value||'NQ'),
    tendance:(document.getElementById('f-tend')||{}).value||'Bullish',
    bias:(document.getElementById('f-bias')||{}).value||'Long',
    setup:(document.getElementById('f-setup')||{}).value||'A+',
    setupType:(document.getElementById('f-setuptype')||{}).value||'Continuation',
    tfValidation:((document.getElementById('f-tfv')||{}).value==='Autre')?((document.getElementById('f-tfv-custom')||{}).value||'Autre'):((document.getElementById('f-tfv')||{}).value||'—'),
    tfEntry:((document.getElementById('f-tfe')||{}).value==='Autre')?((document.getElementById('f-tfe-custom')||{}).value||'Autre'):((document.getElementById('f-tfe')||{}).value||'M5'),
    entryPrice:(document.getElementById('f-entry')||{}).value||'',
    slPrice:(document.getElementById('f-sl')||{}).value||'',
    tpPrice:(document.getElementById('f-tp')||{}).value||'',
    contracts:(document.getElementById('f-contracts')||{}).value||'',
    risk:(document.getElementById('f-risk')||{}).value||'',
    rrTarget:(document.getElementById('f-rrt')||{}).value||'',
    result:(document.getElementById('f-result')||{}).value||'Win',
    quality:(document.getElementById('f-quality')||{}).value||'A',
    rrActual:(document.getElementById('f-rra')||{}).value||'',
    plR:(document.getElementById('f-plr')||{}).value||'',
    plDollar:(document.getElementById('f-pld')||{}).value||'',
    planRespected:(document.getElementById('f-plan')||{}).value||'Oui',
    emotionalState:(document.getElementById('f-emo')||{}).value||'3',biasCorrect:(document.getElementById('f-biascorrect')||{}).value||'N/A',maeprice:(document.getElementById('f-mae')||{}).value||'',mfeprice:(document.getElementById('f-mfe')||{}).value||'',maeR:(document.getElementById('f-maeR')||{}).value||'',mfeR:(document.getElementById('f-mfeR')||{}).value||'',tags:(document.getElementById('f-tags')||{}).value?((document.getElementById('f-tags')||{}).value).split(',').map(function(t){return t.trim();}).filter(Boolean):[],

    confluences:conf,
    screenshotUrl:(document.getElementById('f-sc')||{}).value||'',
    notes:(document.getElementById('f-notes')||{}).value||'',
    postTradeComment:(document.getElementById('f-ptc')||{}).value||'',
  };
  if(_editingId){
    DB.updateTrade(_editingId,t);
  }else{
    var accts=t.accounts||[t.account||''];
    accts.forEach(function(acct,idx){
      var tradeClone=Object.assign({},t,{id:idx===0?t.id:uid(),account:acct});
      DB.addTrade(tradeClone);
    });
  }
  closeModal();nav(currentPage);
}
function openAddAccount(){
  _editingId=null;
  document.getElementById('modal-title').textContent='NOUVEAU COMPTE PROP';
  document.getElementById('modal-body').innerHTML=accountForm({});
  document.getElementById('modal-overlay').classList.add('open');
}
function editAccount(id){const a=DB.accounts.find(x=>x.id===id);if(!a)return;_editingId=id;document.getElementById('modal-title').textContent='MODIFIER LE COMPTE';document.getElementById('modal-body').innerHTML=accountForm(a);document.getElementById('modal-overlay').classList.add('open');}


function editObjective(id){var o=DB.objectives.find(function(x){return x.id===id;});if(!o)return;_editingId=id;document.getElementById('modal-title').textContent='MODIFIER';document.getElementById('modal-body').innerHTML=objectiveForm(o);document.getElementById('modal-overlay').classList.add('open');}
function openAddObjective(){_editingId=null;const now=new Date();document.getElementById('modal-title').textContent='NOUVEL OBJECTIF';document.getElementById('modal-body').innerHTML=objectiveForm({month:now.getMonth()+1,year:now.getFullYear()});document.getElementById('modal-overlay').classList.add('open');}
function objectiveForm(o){
  const accs=['Tous les comptes',...DB.accounts.map(a=>a.name),'Backtest'];
  return `<div class="form-grid">
  <div class="form-group"><label>MOIS</label><select id="ob-month">${MONTHS_FR.map((m,i)=>`<option value="${i+1}" ${o.month===i+1?'selected':''}>${m}</option>`).join('')}</select></div>
  <div class="form-group"><label>ANNÉE</label><input type="number" id="ob-year" value="${o.year||new Date().getFullYear()}"></div>
  <div class="form-group full"><label>COMPTE CIBLÉ</label><select id="ob-account">
    ${accs.map(a=>`<option value="${a}" ${(o.account||'Tous les comptes')===a?'selected':''}>${a==='Tous les comptes'?'🌐 Objectif personnel (tous comptes)':a}</option>`).join('')}
  </select></div>
  <div class="form-group"><label>P&L CIBLE ($)</label><input type="number" id="ob-plt" value="${o.plTarget||''}" placeholder="ex: 3000"></div>
  <div class="form-group"><label>NB TRADES CIBLE</label><input type="number" id="ob-trd" value="${o.tradesTarget||''}" placeholder="ex: 20"></div>
  <div class="form-group"><label>WIN RATE CIBLE (%)</label><input type="number" id="ob-wr" value="${o.winrateTarget||''}" placeholder="ex: 60"></div>
  <div class="form-group"><label>STATUT</label><select id="ob-status">${['🔄 En cours','✅ Atteint','❌ Raté'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
</div>
<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()" style="flex:1">Annuler</button><button class="btn btn-primary" onclick="saveObjective()" style="flex:2">Enregistrer ✓</button></div>`;}
function saveObjective(){var sid=_editingId;var o={id:sid||uid(),month:parseInt(document.getElementById('ob-month').value)||1,year:parseInt(document.getElementById('ob-year').value)||new Date().getFullYear(),account:document.getElementById('ob-account').value||'Tous les comptes',plTarget:document.getElementById('ob-plt').value,tradesTarget:document.getElementById('ob-trd').value,winrateTarget:document.getElementById('ob-wr').value,status:document.getElementById('ob-status').value};var objs=DB.objectives;if(sid){var fi=objs.findIndex(function(x){return x.id===sid;});if(fi>-1)objs[fi]=o;}else{objs.push(o);}DB.objectives=objs;closeModal();nav('objectives');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');_editingId=null;}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
// ── INIT ─────────────────────────────────────────────────────────────────────
try{if(localStorage.getItem('sidebar_collapsed')==='1'){var sb=document.getElementById('sidebar');var btn=document.getElementById('sidebar-toggle');if(sb){sb.classList.add('collapsed');var lbl=sb.querySelector('.btn-label');var ico=sb.querySelector('.btn-icon');if(lbl)lbl.style.display='none';if(ico)ico.style.display='';}if(btn){btn.textContent='»»';btn.title='Ouvrir';}}}catch(e){}

try {
  nav('dashboard');
  try{syncUpdateBadge();syncInitOnLoad();}catch(e){console.error('sync init',e);}
} catch(e) {
  var em=document.getElementById('main');
  if(em) em.innerHTML='<div style="padding:24px;margin:20px;background:rgba(155,93,229,0.1);border:1px solid #b57bee;border-radius:12px;color:#d0d0e8">'
    +'<div style="font-size:14px;font-weight:800;color:#b57bee;margin-bottom:12px">⚠️ Erreur de chargement</div>'
    +'<div style="font-family:monospace;font-size:11px;color:#b57bee">'+e.message+'</div>'
    +'<div style="font-family:monospace;font-size:9px;color:var(--muted);margin-top:8px;white-space:pre-wrap">'+(e.stack||'').slice(0,500)+'</div>'
    +'</div>';
}

</script>
</body>
