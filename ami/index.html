<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Trading Journal — ICT/SMC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#06060e;--s1:#0e0e1a;--s2:#131320;--s3:#181828;--border:#1e1e32;--border2:#2a2a42;--accent:#3b82f6;--accent2:#8b5cf6;--green:#00d46a;--red:#9b5de5;--yellow:#f59e0b;--text:#d4d4f0;--muted:#525278;--faint:#0f0f1c;}
*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;}
#sidebar{width:220px;min-width:220px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow:hidden;transition:width 0.25s ease,min-width 0.25s ease;}
#sidebar.collapsed{width:56px;min-width:56px;}
#sidebar.collapsed .nav-label{display:none;}
#sidebar.collapsed .logo-title,#sidebar.collapsed .logo-sub{display:none;}
#sidebar.collapsed .sidebar-footer{padding:10px 8px;}
#sidebar.collapsed .btn-add{padding:10px;font-size:16px;letter-spacing:0;border-radius:10px;}
#sidebar.collapsed .btn-add .btn-label{display:none;}
#sidebar.collapsed .nav-item{padding:10px;justify-content:center;}
#sidebar.collapsed .nav-icon{width:auto;font-size:16px;}
.sidebar-toggle{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 4px;border-radius:5px;transition:all 0.2s;line-height:1;}
.sidebar-toggle:hover{color:var(--text);background:var(--s2);}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.logo-dots{display:flex;gap:4px;margin-bottom:8px;}.logo-dot{width:7px;height:7px;border-radius:50%;}
.logo-title{font-size:13px;font-weight:900;letter-spacing:3px;color:var(--text);}
.logo-sub{font-size:8px;letter-spacing:2px;color:var(--muted);margin-top:2px;font-weight:600;}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:2px;transition:all 0.2s;border:1px solid transparent;letter-spacing:0.5px;}
.nav-item:hover{background:var(--s2);color:var(--text);}.nav-item.active{background:var(--s2);color:var(--text);border-color:var(--border);font-weight:700;}
.nav-icon{font-size:14px;width:18px;text-align:center;}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);}
.btn-add{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:10px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:1.5px;cursor:pointer;box-shadow:0 4px 16px rgba(59,130,246,0.35);transition:all 0.2s;}
.btn-add:hover{transform:translateY(-1px);}
#main{flex:1;height:100vh;overflow-y:auto;background:var(--bg);}
.page{padding:28px;max-width:1300px;}
.page-title{font-size:20px;font-weight:900;letter-spacing:2px;margin-bottom:4px;}
.page-sub{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:600;margin-bottom:24px;}
.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;}
.card-title{font-size:9px;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:14px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.grid-6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center;}
.kpi-label{font-size:8px;letter-spacing:2.5px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.kpi-value{font-size:20px;font-weight:900;font-family:'Courier New',monospace;}
.kpi-sub{font-size:9px;color:var(--muted);margin-top:3px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{color:var(--muted);font-size:8px;letter-spacing:2px;font-weight:700;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}tr:hover td{background:var(--s2);}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:0.5px;}
.bg{background:rgba(0,212,106,0.15);color:var(--green);}.br{background:rgba(155,93,229,0.20);color:var(--red);}
.bb{background:rgba(59,130,246,0.15);color:var(--accent);}.by{background:rgba(245,158,11,0.15);color:var(--yellow);}
.bp{background:rgba(139,92,246,0.15);color:var(--accent2);}.bm{background:rgba(82,82,120,0.2);color:var(--muted);}
.btn{border:none;padding:7px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.5px;transition:all 0.2s;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 3px 12px rgba(59,130,246,0.3);}
.btn-ghost{background:var(--s2);border:1px solid var(--border);color:var(--muted);}
.btn-danger{background:rgba(155,93,229,0.20);border:1px solid rgba(155,93,229,0.40);color:var(--red);}
.btn-sm{padding:4px 9px;font-size:10px;}
.chart-type-btns{display:flex;gap:3px;}
.ctype-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:10px;transition:all 0.15s;}
.ctype-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day-hdr{text-align:center;font-size:9px;color:var(--muted);letter-spacing:1px;font-weight:700;padding:4px;}
.cal-day{min-height:72px;border-radius:9px;border:1px solid var(--border);padding:7px 6px;background:var(--s2);cursor:pointer;transition:all 0.2s;}
.cal-day.profit{background:rgba(0,212,106,0.12);border-color:rgba(0,212,106,0.3);}
.cal-day.loss{background:rgba(155,93,229,0.14);border-color:rgba(155,93,229,0.35);}
.cal-day.today{border-color:var(--accent);}
.cal-day-num{font-size:10px;color:var(--muted);margin-bottom:3px;}
.cal-day-pl{font-size:11px;font-weight:800;font-family:'Courier New',monospace;}
.clock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.clock-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px 12px;text-align:center;position:relative;overflow:hidden;transition:all 0.5s;}
.clock-card.active{box-shadow:0 0 28px var(--c,#3b82f6)18;}
.clock-card .top-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c,#3b82f6),transparent);opacity:0;transition:opacity 0.5s;}
.clock-card.active .top-line{opacity:1;}
.clock-flag{font-size:28px;margin-bottom:6px;}.clock-city{font-size:8px;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:10px;}
.clock-time{font-family:'Courier New',monospace;font-size:22px;font-weight:900;letter-spacing:2px;transition:color 0.5s,text-shadow 0.5s;}
.clock-card.active .clock-time{color:var(--c,#3b82f6);text-shadow:0 0 18px var(--c,#3b82f6);}
.clock-date{font-size:9px;color:var(--muted);margin-top:4px;}
.clock-status{display:inline-block;margin-top:9px;padding:3px 9px;border-radius:20px;font-size:8px;font-weight:700;letter-spacing:1.5px;background:var(--faint);border:1px solid var(--border);color:var(--muted);transition:all 0.5s;}
.clock-card.active .clock-status{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.4);color:var(--c,#3b82f6);}
.my-badge{position:absolute;top:7px;right:7px;background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.4);border-radius:5px;padding:2px 5px;font-size:7px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.tl-wrap{position:relative;height:90px;margin:10px 0 4px;}
.tl-bar{position:absolute;height:13px;border-radius:7px;overflow:hidden;display:flex;align-items:center;transition:all 0.5s;opacity:0.3;}
.tl-bar.active{opacity:1;}.tl-bar span{font-size:7px;padding-left:7px;font-weight:800;letter-spacing:1px;white-space:nowrap;color:rgba(0,0,0,0.8);}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);box-shadow:0 0 8px var(--red);z-index:10;}
.tl-now-dot{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);}
.my-session-row{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px 14px;border-radius:9px;background:var(--faint);border:1px solid var(--border);transition:all 0.5s;}
.my-session-row.active{background:rgba(59,130,246,0.07);border-color:rgba(59,130,246,0.3);}
.annual-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.month-card{border-radius:12px;padding:14px;border:1px solid var(--border);background:var(--s1);}
.month-card.pos{background:rgba(0,212,106,0.08);border-color:rgba(0,212,106,0.3);}
.month-card.neg{background:rgba(155,93,229,0.10);border-color:rgba(155,93,229,0.35);}
.month-name{font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.month-pct{font-size:20px;font-weight:900;font-family:'Courier New',monospace;}
.month-pl{font-size:11px;font-family:'Courier New',monospace;margin-top:3px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{display:flex;flex-direction:column;gap:5px;}.form-group.full{grid-column:1/-1;}
label{font-size:8px;letter-spacing:2px;color:var(--muted);font-weight:700;}
input,select,textarea{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:12px;font-family:inherit;outline:none;width:100%;transition:border-color 0.2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input[type=datetime-local],input[type=date]{color-scheme:dark;}
textarea{resize:vertical;min-height:60px;}
.check-group{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.check-item{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;cursor:pointer;transition:all 0.2s;}
.check-item input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0;}
.check-item span{font-size:10px;color:var(--muted);}
.emotion-row{display:flex;gap:6px;}
.emo-btn{flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.2s;}
.emo-btn.active{border-color:var(--accent);background:rgba(59,130,246,0.12);color:var(--accent);}
.section-title{font-size:10px;letter-spacing:2px;color:var(--accent);font-weight:800;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:12px;grid-column:1/-1;}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px);}
#modal-overlay.open{display:flex;}
#modal{background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-title{font-size:13px;font-weight:900;letter-spacing:2px;}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
.modal-footer{display:flex;gap:10px;margin-top:20px;}
.pb-section h3{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.pb-rule{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.pb-rule:last-child{border-bottom:none;}.pb-dot{width:8px;height:8px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.pb-text{font-size:12px;color:var(--text);line-height:1.5;}
.pb-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px;}
.pb-table th{background:var(--s2);color:var(--muted);font-size:8px;letter-spacing:1.5px;padding:8px 10px;text-align:left;font-weight:700;}
.pb-table td{padding:8px 10px;border-top:1px solid var(--border);}
.acc-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;}
.acc-stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
.acc-stat:last-child{border-bottom:none;}.acc-stat-label{font-size:10px;color:var(--muted);}
.acc-stat-value{font-size:12px;font-weight:700;font-family:'Courier New',monospace;}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:2px;transition:width 0.5s;}
.anal-section{margin-bottom:24px;}
.anal-section-title{font-size:9px;letter-spacing:3px;color:var(--accent);font-weight:800;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.streak-box{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;}
.streak-val{font-size:28px;font-weight:900;font-family:'Courier New',monospace;}
.streak-label{font-size:8px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-top:4px;}
.news-link{display:flex;flex-direction:column;gap:6px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.2s;}
.news-link:hover{border-color:var(--accent);background:var(--s2);}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.flex-row{display:flex;align-items:center;gap:10px;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}
.screenshot-img{width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-top:8px;border:1px solid var(--border);}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ── RESPONSIVE ── */
@media(min-width:1600px){
  .page{max-width:1500px;padding:32px 36px;}
  .kpi-value{font-size:22px;}
  .card{padding:22px;}
  #sidebar{width:240px;min-width:240px;}
}
@media(min-width:2000px){
  .page{max-width:1800px;}
  #sidebar{width:260px;min-width:260px;}
  body{font-size:13px;}
  .kpi-value{font-size:24px;}
  th{font-size:9px;}td{font-size:13px;}
}
@media(max-width:900px){
  .grid-4,.grid-5,.grid-6{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:1fr 1fr;}
  .annual-grid{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:600px){
  .grid-2,.grid-3,.grid-4,.grid-5,.grid-6{grid-template-columns:1fr;}
  .annual-grid{grid-template-columns:repeat(2,1fr);}
  .clock-grid{grid-template-columns:1fr 1fr;}
  .check-group{grid-template-columns:repeat(2,1fr);}
  .page{padding:16px;}
}
</style>
</head>
<body>
<nav id="sidebar">
  <div class="sidebar-logo">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div class="logo-dots" style="margin-bottom:0">
        <div class="logo-dot" style="background:#00d46a;box-shadow:0 0 6px #00d46a"></div>
        <div class="logo-dot" style="background:#3b82f6;box-shadow:0 0 6px #3b82f6;margin-top:2px"></div>
      </div>
      <button class="sidebar-toggle" onclick="toggleSidebar()" id="sidebar-toggle" title="Réduire">‹‹</button>
    </div>
    <div class="logo-title nav-label">TRADING JOURNAL</div>
    <div class="logo-sub nav-label">ICT / SMC · SESSION NY</div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item active" onclick="nav('dashboard')"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></div>
    <div class="nav-item" onclick="nav('sessions')"><span class="nav-icon">🌍</span><span class="nav-label">Sessions</span></div>
    <div class="nav-item" onclick="nav('calendar')"><span class="nav-icon">📅</span><span class="nav-label">Calendrier</span></div>
    <div class="nav-item" onclick="nav('annual')"><span class="nav-icon">📆</span><span class="nav-label">Vue Annuelle</span></div>
    <div class="nav-item" onclick="nav('analytics')"><span class="nav-icon">📊</span><span class="nav-label">Analytics</span></div>
    <div class="nav-item" onclick="nav('trades')"><span class="nav-icon">📋</span><span class="nav-label">Trades</span></div>
    <div class="nav-item" onclick="nav('scalps')"><span class="nav-icon">⚡</span><span class="nav-label">Scalp</span></div>
    <div class="nav-item" onclick="nav('accounts')"><span class="nav-icon">🏦</span><span class="nav-label">Comptes Prop</span></div>
    <div class="nav-item" onclick="nav('rentability')"><span class="nav-icon">💰</span><span class="nav-label">Rentabilité</span></div>
    <div class="nav-item" onclick="nav('objectives')"><span class="nav-icon">🎯</span><span class="nav-label">Objectifs</span></div>
    <div class="nav-item" onclick="nav('playbook')"><span class="nav-icon">📖</span><span class="nav-label">Playbook</span></div>
    <div class="nav-item" onclick="nav('news')"><span class="nav-icon">📡</span><span class="nav-label">News & Macro</span></div>
    <div class="nav-item" onclick="nav('weekly')"><span class="nav-icon">📋</span><span class="nav-label">Revue Hebdo</span></div>
    <div class="nav-item" onclick="nav('topdown')"><span class="nav-icon">🔍</span><span class="nav-label">Top Down</span></div>
    <div class="nav-item" onclick="nav('leaderboard')"><span class="nav-icon">🏆</span><span class="nav-label">Leaderboard</span></div>
    <div class="nav-item" onclick="nav('backup')"><span class="nav-icon">💾</span><span class="nav-label">Sauvegarde</span><span id="nav-sync-dot" style="display:none;margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)"></span><span id="nav-backup-dot" style="display:none;margin-left:6px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red)"></span></div>
    
  </div>
  <div class="sidebar-footer">
    <button class="btn-add" onclick="openModal()"><span class="btn-label">+ NOUVEAU TRADE</span><span class="btn-icon" style="display:none">+</span></button>
  <div style="display:flex;gap:4px;margin-top:6px"><button onclick="exportData()" class="nav-item" style="flex:1;justify-content:center;font-size:9px;padding:5px" title="Exporter tout">💾</button><button onclick="importData()" class="nav-item" style="flex:1;justify-content:center;font-size:9px;padding:5px" title="Importer une sauvegarde">📥</button></div>
  </div>
</nav>
<main id="main"></main>
<div id="modal-overlay" onclick="closeModalOutside(event)">
  <div id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">NOUVEAU TRADE</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<script>var lbTab='months';var lbFilter='ALL';
var dashFilter='ALL';
var calFilter='ALL';
var annFilter='ALL';
var analFilter='ALL';
var tradeFilter='ALL';
var tradeSort='date-desc';
var tradeDateFrom='';
var tradeDateTo='';
var calYear=new Date().getFullYear();var weekOffset=0;var currentWeekKey='';var weekFilter='ALL';var viewingObjective=null;var tdOffset=0;var currentTDKey='';
var calMonth=new Date().getMonth();
var annYear=new Date().getFullYear();
function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var btn=document.getElementById('sidebar-toggle');
  var collapsed=sb.classList.toggle('collapsed');
  if(btn){btn.textContent=collapsed?'»»':'‹‹';btn.title=collapsed?'Ouvrir':'Réduire';}
  var addBtn=sb.querySelector('.btn-add');
  if(addBtn){
    var lbl=addBtn.querySelector('.btn-label');
    var ico=addBtn.querySelector('.btn-icon');
    if(lbl)lbl.style.display=collapsed?'none':'';
    if(ico)ico.style.display=collapsed?'':'none';
  }

  var all=DB.trades;

function consistencyScore(trades){
  if(!trades.length)return {score:0,plan:0,conf:0,bias:null};
  var planW={Oui:100,Partiel:50,Non:0};
  var planT=trades.filter(function(t){return t.planRespected;});
  var plan=planT.length?Math.round(planT.reduce(function(s,t){return s+(planW[t.planRespected]||0);},0)/planT.length):0;
  var conf=Math.round(trades.reduce(function(s,t){var c=t.confluences||{},n=Object.values(c).filter(Boolean).length;return s+(n/7)*100;},0)/trades.length);
  var biasT=trades.filter(function(t){return t.biasCorrect&&t.biasCorrect!=='N/A';});
  var bias=biasT.length?Math.round(biasT.filter(function(t){return t.biasCorrect==='Oui';}).length/biasT.length*100):null;
  var score=bias!==null?Math.round((plan+conf+bias)/3):Math.round((plan+conf)/2);
  return {score:score,plan:plan,conf:conf,bias:bias};
}

// ── SAUVEGARDE / RESTAURATION ────────────────────────────────────────────────
// Clés persistées par l'app. Tout ce qui commence par ces préfixes est sauvegardé.
var BACKUP_PREFIXES=['tj_','wk_n_','td_'];
function isBackupKey(k){return BACKUP_PREFIXES.some(function(p){return k.indexOf(p)===0;});}

function collectAllData(){
  var store={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(isBackupKey(k)){try{store[k]=JSON.parse(localStorage.getItem(k));}catch(e){store[k]=localStorage.getItem(k);}}
  }
  return store;
}

function backupStats(){
  var s=collectAllData();
  var keys=Object.keys(s);
  return {
    trades:(s.tj_trades||[]).length,
    scalps:(s.tj_scalps||[]).length,
    rent:(s.tj_rent||[]).length,
    weeks:keys.filter(function(k){return k.indexOf('wk_n_')===0;}).length,
    topdowns:keys.filter(function(k){return k.indexOf('td_')===0;}).length,
    accounts:(s.tj_accounts||[]).length,
    objectives:(s.tj_objectives||[]).length,
    bytes:JSON.stringify(s).length
  };
}

function fmtBytes(b){return b>1048576?(b/1048576).toFixed(1)+' Mo':b>1024?(b/1024).toFixed(0)+' Ko':b+' o';}

function exportData(){
  var store=collectAllData();
  var st=backupStats();
  var data={
    version:'2.0',
    exportDate:new Date().toISOString(),
    stats:st,
    store:store,
    // rétro-compatibilité avec les anciennes sauvegardes v1.0
    trades:store.tj_trades||[],accounts:store.tj_accounts||[],objectives:store.tj_objectives||[]
  };
  var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='trading-journal-'+new Date().toISOString().split('T')[0]+'.json';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  try{localStorage.setItem('tj_lastBackup',new Date().toISOString());}catch(e){}
  toast('Sauvegarde exportée — '+st.trades+' trades · '+st.weeks+' semaines · '+st.topdowns+' top-down ('+fmtBytes(st.bytes)+')');
  if(currentPage==='backup')nav('backup');
}

function importData(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json,application/json';
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        var store=data.store;
        // Ancienne sauvegarde v1.0 : on reconstruit le store
        if(!store){
          store={};
          if(data.trades)store.tj_trades=data.trades;
          if(data.accounts)store.tj_accounts=data.accounts;
          if(data.objectives)store.tj_objectives=data.objectives;
        }
        var keys=Object.keys(store).filter(isBackupKey);
        if(!keys.length){alert('Ce fichier ne contient aucune donnée reconnue.');return;}
        var nT=(store.tj_trades||[]).length;
        var nW=keys.filter(function(k){return k.indexOf('wk_n_')===0;}).length;
        var nD=keys.filter(function(k){return k.indexOf('td_')===0;}).length;
        var cur=backupStats();
        var msg='Importer cette sauvegarde ?\n\n'
          +'📅 Date : '+(data.exportDate?new Date(data.exportDate).toLocaleString('fr-FR'):'inconnue')+'\n'
          +'📥 Contenu : '+nT+' trades · '+nW+' revues hebdo · '+nD+' top-down\n\n'
          +'⚠️ Cela REMPLACE tes données actuelles ('+cur.trades+' trades).\n'
          +'Une copie de secours sera téléchargée avant.';
        if(!confirm(msg))return;
        if(cur.trades>0||cur.weeks>0)exportData(); // filet de sécurité
        // On efface uniquement les clés de l'app, puis on restaure
        var toRemove=[];
        for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(isBackupKey(k))toRemove.push(k);}
        toRemove.forEach(function(k){localStorage.removeItem(k);});
        keys.forEach(function(k){
          var v=store[k];
          localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
        });
        toast('Import réussi : '+nT+' trades · '+nW+' revues · '+nD+' top-down');
        nav(currentPage);
      }catch(err){
        alert('Erreur lors de l\'importation : '+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Export CSV des trades (pour Excel / Google Sheets)
function exportCSV(){
  var ts=DB.trades;
  if(!ts.length){alert('Aucun trade à exporter.');return;}
  var cols=['date','account','instrument','session','tendance','bias','setup','setupType','tfValidation','tfEntry','entryPrice','slPrice','tpPrice','contracts','risk','rrTarget','rrActual','result','quality','plR','plDollar','planRespected','emotionalState','biasCorrect','tags','notes','postTradeComment'];
  var esc=function(v){v=(v===undefined||v===null)?'':String(v);return '"'+v.replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';};
  var lines=[cols.join(';')];
  ts.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');}).forEach(function(t){
    lines.push(cols.map(function(c){return esc(Array.isArray(t[c])?t[c].join(' | '):t[c]);}).join(';'));
  });
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='trades-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast(ts.length+' trades exportés en CSV');
}

function addTag(tg){var el=document.getElementById('f-tags');if(!el)return;var tags=el.value?el.value.split(',').map(function(t){return t.trim();}):[];if(tags.indexOf(tg)<0){tags.push(tg);el.value=tags.join(', ');}}
function parseObjectives(goalsStr){
  if(!goalsStr)return [];
  return goalsStr.split('\n').map(function(line){
    return line.replace(/^\s*\d+\s*[-).:]\s*/,'').replace(/^\s*[-*•]\s*/,'').trim();
  }).filter(function(l){return l.length>0;});
}
function getPrevWeekObjectives(weekKey){
  // Get objectives written in the PREVIOUS week's "goals" field
  var parts=weekKey.split('-W');
  var yr=parseInt(parts[0]),wn=parseInt(parts[1]);
  var prevWn=wn-1,prevYr=yr;
  if(prevWn<1){prevYr=yr-1;prevWn=52;}
  var prevKey=prevYr+'-W'+String(prevWn).padStart(2,'0');
  var prevNotes=DB.getWeekNotes(prevKey);
  var objs=parseObjectives(prevNotes.goals||'');
  // Also carry over uncompleted objectives from before that were not removed
  var curNotes=DB.getWeekNotes(weekKey);
  var removed=curNotes.removed||[];
  return objs.filter(function(o){return removed.indexOf(o)<0;});
}

function getWeekKey(d,off){var dt=new Date(d);dt.setDate(dt.getDate()+(off||0)*7);var day=dt.getDay()||7;dt.setDate(dt.getDate()+4-day);var ys=new Date(dt.getFullYear(),0,1);var wn=Math.ceil((((dt-ys)/86400000)+1)/7);return dt.getFullYear()+'-W'+String(wn).padStart(2,'0');}
function getWeekRange(wk){var pts=wk.split('-W');var yr=parseInt(pts[0]),wn=parseInt(pts[1]);var j4=new Date(yr,0,4);var ms=j4.getTime()-(j4.getDay()||7-1)*86400000+(wn-1)*7*86400000;var s=new Date(ms),e=new Date(ms+6*86400000);var fm=function(d){return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();};return {s:s,e:e,label:fm(s)+' au '+fm(e),ks:s.toISOString().split('T')[0],ke:e.toISOString().split('T')[0]};}

pace">'+fmt$(parseFloat(best.plDollar||0))+'</div><div style="font-size:10px;color:var(--muted)">'+(best.date||'').slice(0,10)+' '+(best.instrument||'')+' '+(best.setup||'')+'</div></div>':'')+(worst&&worst!==best?'<div class="card" style="border-color:rgba(155,93,229,0.3)"><div class="card-title">PIRE TRADE</div><div style="font-size:22px;font-weight:900;color:var(--red);font-family:monospace">'+fmt$(parseFloat(worst.plDollar||0))+'</div><div style="font-size:10px;color:var(--muted)">'+(worst.date||'').slice(0,10)+' '+(worst.instrument||'')+' '+(worst.setup||'')+'</div></div>':'')+'</div>':'')+(wT.length?'<div class="card" style="margin-bottom:14px"><div class="card-title">TRADES</div><div style="overflow-x:auto"><table><thead><tr><th>DATE</th><th>INSTR</th><th>SETUP</th><th>SESSION</th><th>RESULTAT</th><th>R:R</th><th>P&L</th><th>TAGS</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'<div class="empty-state" style="margin-bottom:14px"><div class="empty-icon">-</div><p>Aucun trade cette semaine</p></div>')+'<div id="week-notes-ctr"></div>';

// ── SYNCHRONISATION CLOUD (Supabase) ─────────────────────────────────────────
// Chaque personne a un CODE perso. PC + téléphone = même code = mêmes données.
// Ton pote a son propre code : journaux 100% séparés sur le même projet.
var SUPA_URL='https://fqtpwikiwitgwgryqopz.supabase.co';
var SUPA_KEY='sb_publishable_-W5gaKumRwbgwyZkIfpPoQ_Hz33IRMl';
var _supaClient=null;
var _syncApplying=false;   // vrai pendant qu'on applique des données distantes (évite la boucle)
var _syncPushTimer=null;
var _syncBusy=false;

function syncLibReady(){return typeof supabase!=='undefined'&&supabase&&typeof supabase.createClient==='function';}
function syncClient(){
  if(_supaClient)return _supaClient;
  if(!syncLibReady())return null;
  try{_supaClient=supabase.createClient(SUPA_URL,SUPA_KEY);return _supaClient;}
  catch(e){return null;}
}
function syncCode(){try{return localStorage.getItem('sync_code')||'';}catch(e){return '';}}
function syncEnabled(){return !!syncCode();}
function syncSetCode(c){try{c?localStorage.setItem('sync_code',c):localStorage.removeItem('sync_code');}catch(e){}}
function syncGenCode(){
  var s='';var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(var i=0;i<20;i++){s+=chars[Math.floor(Math.random()*chars.length)];if(i%4===3&&i<19)s+='-';}
  return s;
}
function syncStatusText(){
  if(!syncEnabled())return null;
  var ts=localStorage.getItem('sync_serverTs');
  var dirty=localStorage.getItem('sync_dirty')==='1';
  if(dirty)return 'Modifs locales en attente d\'envoi…';
  if(ts)return 'Synchronisé · '+new Date(ts).toLocaleString('fr-FR');
  return 'Prêt';
}

// Écrit les données distantes en local, sans redéclencher de push
function syncApplyStore(store){
  _syncApplying=true;
  try{
    var toRemove=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(isBackupKey(k))toRemove.push(k);}
    toRemove.forEach(function(k){localStorage.removeItem(k);});
    Object.keys(store).forEach(function(k){
      if(!isBackupKey(k))return;
      var v=store[k];
      localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));
    });
  }finally{_syncApplying=false;}
}

// Appelé à chaque écriture locale (_s) : marque « à envoyer » et programme un push
function syncOnLocalWrite(k){
  if(_syncApplying)return;
  if(!syncEnabled())return;
  if(typeof isBackupKey!=='function'||!isBackupKey(k))return;
  try{localStorage.setItem('sync_dirty','1');}catch(e){}
  syncSchedulePush();
  syncUpdateBadge();
}
function syncSchedulePush(){
  if(_syncPushTimer)clearTimeout(_syncPushTimer);
  _syncPushTimer=setTimeout(function(){syncPush();},2500);
}

function syncPush(cb){
  if(!syncEnabled())return cb&&cb(false);
  var cl=syncClient();if(!cl)return cb&&cb(false);
  if(_syncBusy)return cb&&cb(false);
  _syncBusy=true;syncUpdateBadge('push');
  var store=collectAllData();
  cl.rpc('save_journal',{p_code:syncCode(),p_data:store}).then(function(res){
    _syncBusy=false;
    if(res.error){toast('Sync : échec d\'envoi ('+res.error.message+')','err');syncUpdateBadge();return cb&&cb(false);}
    try{localStorage.setItem('sync_serverTs',res.data||new Date().toISOString());localStorage.setItem('sync_dirty','0');}catch(e){}
    syncUpdateBadge();if(currentPage==='backup')nav('backup');cb&&cb(true);
  }).catch(function(err){_syncBusy=false;toast('Sync : erreur réseau','err');syncUpdateBadge();cb&&cb(false);});
}

function syncPull(opts,cb){
  opts=opts||{};
  if(!syncEnabled())return cb&&cb(null);
  var cl=syncClient();if(!cl)return cb&&cb(null);
  cl.rpc('get_journal',{p_code:syncCode()}).then(function(res){
    if(res.error){if(opts.loud)toast('Sync : échec de lecture','err');return cb&&cb(null);}
    var row=(res.data&&res.data.length)?res.data[0]:null;
    if(!row){return cb&&cb({exists:false});}
    var remoteTs=row.updated_at,localTs=localStorage.getItem('sync_serverTs');
    var newer=!localTs||new Date(remoteTs)>new Date(localTs);
    if(opts.apply&&newer){
      var dirty=localStorage.getItem('sync_dirty')==='1';
      if(dirty && !opts.force){
        // Conflit : modifs locales non envoyées ET le cloud est plus récent
        if(!confirm('Le cloud contient une version plus récente (autre appareil), mais tu as des modifications locales non envoyées.\n\nOK = garder la version du CLOUD (tes modifs locales seront perdues)\nAnnuler = garder tes modifs locales (elles écraseront le cloud au prochain envoi)')){
          return cb&&cb({exists:true,ts:remoteTs,applied:false,conflict:true});
        }
      }
      syncApplyStore(row.data||{});
      try{localStorage.setItem('sync_serverTs',remoteTs);localStorage.setItem('sync_dirty','0');}catch(e){}
      if(opts.rerender!==false)nav(currentPage);
      if(opts.loud)toast('Données récupérées depuis le cloud');
      return cb&&cb({exists:true,ts:remoteTs,applied:true});
    }
    cb&&cb({exists:true,ts:remoteTs,applied:false});
  }).catch(function(){if(opts.loud)toast('Sync : erreur réseau','err');cb&&cb(null);});
}

// Synchro manuelle « maintenant » : on pousse d'abord si dirty, sinon on tire
function syncNow(){
  if(!syncEnabled()){toast('Active d\'abord la synchro','err');return;}
  if(!syncClient()){toast('Librairie cloud non chargée — vérifie ta connexion','err');return;}
  var dirty=localStorage.getItem('sync_dirty')==='1';
  if(dirty){syncPush(function(ok){if(ok)toast('Envoyé vers le cloud');});}
  else{syncPull({apply:true,loud:true});}
}

// Au chargement de l'app
function syncInitOnLoad(){
  if(!syncEnabled())return;
  if(!syncClient()){setTimeout(syncInitOnLoad,1500);return;} // librairie pas encore prête
  syncPull({apply:true},function(r){
    if(r&&r.exists===false){
      // Rien dans le cloud encore → on pousse l'état local actuel
      syncPush();
    }
  });
}

function syncConnect(code){
  code=(code||'').trim();
  if(code.length<6){toast('Code trop court (min 6 caractères)','err');return;}
  if(!syncClient()){toast('Librairie cloud non chargée — vérifie ta connexion','err');return;}
  syncSetCode(code);
  try{localStorage.removeItem('sync_serverTs');}catch(e){}
  // On regarde ce qu'il y a dans le cloud pour ce code
  syncPull({apply:false},function(r){
    if(r&&r.exists){
      if(confirm('Un journal existe déjà pour ce code (autre appareil).\n\nOK = récupérer ces données ici (remplace le contenu local)\nAnnuler = garder le contenu local et l\'envoyer vers le cloud')){
        syncPull({apply:true,force:true,loud:true});
      }else{
        syncPush(function(ok){if(ok)toast('Données locales envoyées vers le cloud');});
      }
    }else{
      // Cloud vide → premier envoi
      syncPush(function(ok){if(ok)toast('Synchro activée — données envoyées');});
    }
    nav('backup');
  });
}
function syncDisconnect(){
  if(!confirm('Déconnecter la synchro ?\n\nL\'appli repassera en mode local sur cet appareil. Tes données restent, mais ne se synchroniseront plus. Le journal reste disponible dans le cloud pour tes autres appareils.'))return;
  syncSetCode('');
  try{localStorage.removeItem('sync_serverTs');localStorage.removeItem('sync_dirty');}catch(e){}
  toast('Synchro désactivée');nav('backup');
}

// Petit indicateur d'état dans le menu
function syncUpdateBadge(mode){
  var dot=document.getElementById('nav-sync-dot');if(!dot)return;
  if(!syncEnabled()){dot.style.display='none';return;}
  dot.style.display='block';
  var dirty=localStorage.getItem('sync_dirty')==='1';
  var col=mode==='push'?'var(--yellow)':dirty?'var(--yellow)':'var(--green)';
  dot.style.background=col;dot.style.boxShadow='0 0 6px '+col;
}

// Re-synchro quand on revient sur l'appli (changement d'appareil)
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&syncEnabled()){
    // si des modifs locales sont en attente on les envoie, sinon on tire les nouveautés
    if(localStorage.getItem('sync_dirty')==='1')syncPush();
    else syncPull({apply:true});
  }
});

// Compresse une image (redimensionne + JPEG) avant stockage — évite de saturer le quota 5 Mo
function compressImage(file,maxW,quality,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var ctx=cv.getContext('2d');
      ctx.fillStyle='#0e0e1a';ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',quality));}catch(e){cb(ev.target.result);}
    };
    img.onerror=function(){cb(ev.target.result);};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function tdScreenshot(tf){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    compressImage(file,1400,0.72,function(dataUrl){
      var wk=currentTDKey;var d=getTopDownData(wk);
      if(!d.tfs[tf])d.tfs[tf]={bias:'',niveaux:'',notes:'',screenshot:''};
      d.tfs[tf].screenshot=dataUrl;
      saveTopDownData(wk,d);
      toast('Capture ajoutée ('+fmtBytes(dataUrl.length)+')');
      nav('topdown');
    });
  };
  inp.click();
}
function tdRemoveScreenshot(tf){
  var wk=currentTDKey;var d=getTopDownData(wk);
  if(d.tfs[tf])d.tfs[tf].screenshot='';
  saveTopDownData(wk,d);nav('topdown');
}
function tdPrev(){tdOffset--;nav('topdown');}
function tdNext(){tdOffset++;nav('topdown');}
function tdCur(){tdOffset=0;nav('topdown');}
function tdToggleEval(){
  var wk=currentTDKey;var d=getTopDownData(wk);
  d.evalDone=!d.evalDone;saveTopDownData(wk,d);nav('topdown');
}
function tdToggleDefs(){

}

function nav(page){
  if(page!=='objectives')viewingObjective=null;
  destroyCharts();
  if(clockInterval){clearInterval(clockInterval);clockInterval=null;}
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.getAttribute('onclick')===`nav('${page}')`));
  const pages={dashboard,sessions,calendar,annual,analytics,trades,scalps,accounts,objectives,playbook,news,leaderboard,weekly:weeklyReport,topdown:topDown,backup,rentability};
  const main=document.getElementById('main');
  main.innerHTML='';
  const wrap=document.createElement('div');
  wrap.className='page';
  wrap.innerHTML=pages[page]();
  main.appendChild(wrap);
  if(page==='sessions')startClock();
  if(page==='analytics'){setTimeout(function(){try{initCharts();}catch(e){var m=document.getElementById('main');if(m)m.innerHTML+='<div style="padding:12px;background:rgba(155,93,229,0.1);border:1px solid #b57bee;border-radius:8px;margin:12px;font-family:monospace;color:#f87171;font-size:11px">ERR: '+e.message+'</div>';}},100);}
  if(page==='objectives'&&viewingObjective){setTimeout(function(){initObjectiveCharts(viewingObjective);},100);}
  if(page==='weekly'){setTimeout(function(){var rng=getWeekRange(currentWeekKey);var wT=DB.trades.filter(function(t){var d=(t.date||'').split('T')[0];return d>=rng.ks&&d<=rng.ke;});initWeekChart(wT);},100);}
  if(page==='annual'){setTimeout(function(){try{initAnnualChart();}catch(e){console.error(e);}},100);}
  if(page==='scalps'){setTimeout(function(){try{initScalpCharts();}catch(e){console.error(e);}},100);}
  if(page==='rentability'){setTimeout(function(){try{initRentCharts();}catch(e){console.error(e);}},100);}
  try{
    var dot=document.getElementById('nav-backup-dot');
    if(dot){var ds=daysSinceBackup();dot.style.display=(ds===null||ds>7)?'block':'none';}
  }catch(e){}
}

function buildAlertHTML(t){
  try{

      var pl=t.filter(function(x){return x.account===a.name;}).reduce(function(s,x){return s+(parseFloat(x.plDollar)||0);},0);
      var mxDD=parseFloat(a.maxDrawdown)||2500;
      if(pl<0){var pc=Math.abs(pl)/mxDD*100;if(pc>=70)out.push({name:a.name,pl:pl,mxDD:mxDD,pc:pc});}
    });
    if(!out.length)return '';
    var h='<div style="margin-bottom:12px">';
    out.forEach(function(al){
      var lv=al.pc>=90;
      h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(155,93,229,0.08);border:1px solid rgba(155,93,229,'+(lv?'0.6':'0.35')+');border-radius:10px;margin-bottom:8px">'
        +'<span>'+(lv?'X':'!')+'</span>'
        +'<div><div style="font-size:11px;font-weight:800;color:#b57bee">DRAWDOWN — '+al.name+'</div>'
        +'<div style="font-size:10px;color:var(--muted)">'+fmt$(Math.round(al.pl))+' / '+fmt$(-al.mxDD)+' — '+al.pc.toFixed(0)+'%</div></div>'

    +'<div class="kpi"><div class="kpi-label">WIN RATE</div><div class="kpi-value" style="color:var(--accent)">'+(t.length?wr+'%':'—')+'</div></div>'

function startClock(){
  const tlw=document.getElementById('tl-wrap');if(!tlw)return;
  SESSIONS_TZ.forEach((s,i)=>{
    const segs=s.overnight?[{l:(s.start/24)*100,w:((24-s.start)/24)*100},{l:0,w:(s.end/24)*100}]:[{l:(s.start/24)*100,w:((s.end-s.start)/24)*100}];
    segs.forEach((seg,si)=>{
      const b=document.createElement('div');b.className='tl-bar';b.id=`bar-${s.id}${si?'-2':''}`;
      b.style.cssText=`left:${seg.l}%;width:${seg.w}%;top:${i*20+2}px;background:${s.color};`;
      if(si===0)b.innerHTML=`<span>${s.label}</span>`;
      tlw.insertBefore(b,document.getElementById('tl-now'));
    });
  });
  function tick(){
    const utcH=new Date().getUTCHours()+new Date().getUTCMinutes()/60;
    const nl=document.getElementById('tl-now');if(nl)nl.style.left=`${(utcH/24)*100}%`;
    SESSIONS_TZ.forEach(s=>{
      const act=isActive(s);
      const card=document.getElementById(`card-${s.id}`);if(!card)return;
      document.getElementById(`time-${s.id}`).textContent=clockStr(s.tz);
      document.getElementById(`date-${s.id}`).textContent=dateStr(s.tz);
      card.classList.toggle('active',act);
      document.getElementById(`status-${s.id}`).textContent=act?'● SESSION ACTIVE':'○ FERMÉ';
      const b=document.getElementById(`bar-${s.id}`);const b2=document.getElementById(`bar-${s.id}-2`);
      if(b)b.classList.toggle('active',act);if(b2)b2.classList.toggle('active',act);
    });
    const myA=utcH>=13.5&&utcH<17;
    const mr=document.getElementById('my-row');const ms=document.getElementById('my-st');const ml=document.getElementById('my-lbl');
    if(mr){mr.classList.toggle('active',myA);if(ms){ms.textContent=myA?'● EN SESSION':'○ HORS SESSION';ms.style.color=myA?'var(--green)':'var(--muted)';}if(ml)ml.style.color=myA?'var(--accent)':'var(--muted)';}
  }
  tick();clockInterval=setInterval(tick,1000);
}

function calendar(){
  const t=DB.trades.filter(x=>calFilter==='ALL'||x.account===calFilter);
  const dim=daysInMonth(calYear,calMonth),fd=firstDay(calYear,calMonth);
  const todayStr=today();
  const mPfx=`${calYear}-${p(calMonth+1)}`;
  const mT=t.filter(x=>x.date&&x.date.startsWith(mPfx));
  const mPL=mT.reduce((s,x)=>s+(parseFloat(x.plDollar)||0),0);
  const wins=mT.filter(x=>x.result==='Win'||x.result==='Win Partiel').length;
  let cells=[];
  for(let i=0;i<fd;i++)cells.push('<div></div>');
  for(let d=1;d<=dim;d++){
    const ds=`${calYear}-${p(calMonth+1)}-${p(d)}`;
    const dt=t.filter(x=>x.date&&x.date.startsWith(ds));
    const pl=dt.reduce((s,x)=>s+(parseFloat(x.plDollar)||0),0);
    const cls=dt.length?(pl>0?'profit':pl<0?'loss':''):'';
    const isT=ds===todayStr;
    cells.push(`<div class="cal-day ${cls}${isT?' today':''}" onclick="calDayClick('${ds}')">
      <div class="cal-day-num${isT?' today-num':''}" style="${isT?'color:var(--accent);font-weight:800':''}">${d}</div>
      ${dt.length?`<div style="font-size:9px;color:var(--muted)">${dt.length}T</div><div class="cal-day-pl" style="color:${pl>0?'var(--green)':pl<0?'var(--red)':'var(--muted)'}">${fmt$(pl)}</div>`:''}
    </div>`);
  }
  return `
<div class="flex-between" style="margin-bottom:6px">
  <div><div class="page-title">📅 CALENDRIER</div><div class="page-sub">PERFORMANCE JOURNALIÈRE</div></div>
${accountSelectHTML(calFilter,"calFilter=this.value;nav('calendar')")}
</div>
<div class="grid-4" style="margin-bottom:14px">

  <div class="kpi"><div class="kpi-label">TRADES</div><div class="kpi-value">${mT.length}</div></div>
  <div class="kpi"><div class="kpi-label">WIN RATE</div><div class="kpi-value" style="color:var(--accent)">${mT.length?pct(wins,mT.length)+'%':'—'}</div></div>
  <div class="kpi"><div class="kpi-label">JOURS ACTIFS</div><div class="kpi-value">${new Set(mT.map(x=>x.date)).size}</div></div>
</div>
<div class="card">
  <div class="flex-between" style="margin-bottom:14px">
    <button class="btn btn-ghost btn-sm" onclick="calPrev()">‹</button>
    <span style="font-weight:800;font-size:14px;letter-spacing:2px">${MONTHS_FR[calMonth].toUpperCase()} ${calYear}</span>
    <button class="btn btn-ghost btn-sm" onclick="calNext()">›</button>

  <div class="cal-grid" style="margin-bottom:6px">${DAYS.map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}</div>

    const wins=mt.filter(x=>x.result==='Win'||x.result==='Win Partiel').length;
    return {name,pl,trades:mt.length,wr:pct(wins,mt.length),pct:pl?(pl/50000*100).toFixed(2):null};
  });
  const yPL=months.reduce((s,m)=>s+m.pl,0);

  return `

// ── ANALYTICS ────────────────────────────────────────────────────────────────
// ── MOTEUR D'ANALYSE MAE / MFE ───────────────────────────────────────────────
// MAE = Maximum Adverse Excursion (pire drawdown pendant le trade, en R)
// MFE = Maximum Favorable Excursion (meilleur profit atteint pendant le trade, en R)
// Répond à deux questions : « est-ce que je coupe trop tôt ? » (capture/MFE)
// et « mes stops sont-ils bien placés ? » (MAE des gagnants).
function realizedR(x){
  if(x.plR!==undefined&&x.plR!==''&&!isNaN(parseFloat(x.plR)))return parseFloat(x.plR);
  var mag=parseFloat(x.rrActual);
  if(isNaN(mag))return 0;
  if(x.result==='Loss')return -Math.abs(mag);
  if(x.result==='Breakeven')return 0;
  return Math.abs(mag);
}
function riskDollars(x){
  var r=realizedR(x),pl=parseFloat(x.plDollar);
  if(r&&!isNaN(pl)&&r!==0)return Math.abs(pl/r);
  // sinon on tente via prix + contrats
  return null;
}
function tradeMaeMfeR(x){
  var maeR=null,mfeR=null;
  // 1) valeurs saisies directement en R (prioritaires)
  if(x.maeR!==undefined&&x.maeR!==''&&!isNaN(parseFloat(x.maeR)))maeR=Math.abs(parseFloat(x.maeR));
  if(x.mfeR!==undefined&&x.mfeR!==''&&!isNaN(parseFloat(x.mfeR)))mfeR=parseFloat(x.mfeR);
  // 2) sinon dérivées des prix
  if((maeR===null||mfeR===null)&&x.entryPrice&&x.slPrice){
    var entry=parseFloat(x.entryPrice),sl=parseFloat(x.slPrice);
    var riskPts=Math.abs(entry-sl);
    if(riskPts>0){
      var isLong=(x.bias==='Long');
      if(maeR===null&&x.maeprice){
        var mae=parseFloat(x.maeprice);
        maeR=Math.abs(isLong?(entry-mae)/riskPts:(mae-entry)/riskPts);
      }
      if(mfeR===null&&x.mfeprice){
        var mfe=parseFloat(x.mfeprice);
        mfeR=isLong?(mfe-entry)/riskPts:(entry-mfe)/riskPts;
      }
    }
  }
  return {maeR:maeR,mfeR:mfeR};
}

function maeMfeAnalysis(trades){
  var rows=[];
  trades.forEach(function(x){
    var r=tradeMaeMfeR(x);
    if(r.maeR===null&&r.mfeR===null)return;
    var isWin=x.result==='Win'||x.result==='Win Partiel';
    var isLoss=x.result==='Loss';
    rows.push({
      maeR:r.maeR,mfeR:r.mfeR,
      plR:realizedR(x),
      riskD:riskDollars(x),
      isWin:isWin,isLoss:isLoss,
      setup:x.setup,setupType:x.setupType,date:x.date,
      plDollar:parseFloat(x.plDollar)||0
    });
  });
  var n=rows.length;
  var A={n:n,rows:rows};
  if(!n)return A;

  var withMae=rows.filter(function(r){return r.maeR!==null;});
  var withMfe=rows.filter(function(r){return r.mfeR!==null;});
  var wins=rows.filter(function(r){return r.isWin;});
  var losses=rows.filter(function(r){return r.isLoss;});
  var avg=function(arr,f){return arr.length?arr.reduce(function(s,r){return s+f(r);},0)/arr.length:0;};

  A.avgMae=avg(withMae,function(r){return r.maeR;});
  A.avgMaeWin=avg(wins.filter(function(r){return r.maeR!==null;}),function(r){return r.maeR;});
  A.avgMaeLoss=avg(losses.filter(function(r){return r.maeR!==null;}),function(r){return r.maeR;});
  var winMaes=wins.filter(function(r){return r.maeR!==null;}).map(function(r){return r.maeR;});
  A.maxMaeWin=winMaes.length?Math.max.apply(null,winMaes):0;
  A.avgMfe=avg(withMfe,function(r){return r.mfeR;});
  A.avgMfeWin=avg(wins.filter(function(r){return r.mfeR!==null;}),function(r){return r.mfeR;});

  // Efficacité de capture agrégée (sur les gagnants avec MFE>0) : R encaissé / R offert
  var capW=wins.filter(function(r){return r.mfeR!==null&&r.mfeR>0.05;});
  var totMfe=capW.reduce(function(s,r){return s+r.mfeR;},0);
  var totReal=capW.reduce(function(s,r){return s+Math.max(0,r.plR);},0);
  A.capture=totMfe>0?(totReal/totMfe):null;
  A.captureN=capW.length;

  // R laissé sur la table = somme (MFE - R réalisé) quand positif, sur les gagnants
  A.leftR=capW.reduce(function(s,r){return s+Math.max(0,r.mfeR-r.plR);},0);
  A.leftRPerTrade=capW.length?A.leftR/capW.length:0;
  // Estimation $ : moyenne du risque $/R sur les trades qui l'exposent
  var riskDs=rows.filter(function(r){return r.riskD!==null;}).map(function(r){return r.riskD;});
  A.avgRiskD=riskDs.length?riskDs.reduce(function(s,v){return s+v;},0)/riskDs.length:null;
  A.leftD=(A.avgRiskD!==null)?A.leftR*A.avgRiskD:null;

  // Gains rendus : trades perdants (ou BE) qui étaient à +1R ou plus avant de se retourner
  A.gainsRendus=losses.filter(function(r){return r.mfeR!==null&&r.mfeR>=1;});
  A.gainsRendusR=A.gainsRendus.reduce(function(s,r){return s+r.mfeR;},0);

  // Stop suggéré : le stop le plus serré qui aurait laissé passer TOUS les gagnants actuels
  A.suggestedStopR=Math.ceil(A.maxMaeWin*10)/10;

  return A;
}

// Verdicts textuels — le cœur actionnable
function maeMfeVerdicts(A){
  if(!A.n)return [];
  var v=[];

  // 1) Coupes-tu trop tôt ?
  if(A.capture!==null&&A.captureN>=3){
    var capPct=Math.round(A.capture*100);
    if(capPct<55){
      v.push({icon:'✂️',tone:'red',title:'Tu coupes trop tôt',
        text:'Sur tes gagnants tu encaisses <b>'+capPct+'%</b> du mouvement offert. Il te reste en moyenne <b>'+A.leftRPerTrade.toFixed(2)+'R</b> par trade dans le marché'
          +(A.leftD!==null?' (~<b>'+fmt$(Math.round(A.leftD))+'</b> au total)':'')+'. Teste des sorties partielles ou un trailing plus lâche.'});
    }else if(capPct>85){
      v.push({icon:'🎯',tone:'green',title:'Excellente capture',
        text:'Tu encaisses <b>'+capPct+'%</b> du potentiel de tes gagnants. Tu sors près des extrêmes — rare et précieux. Ne change rien à tes sorties.'});
    }else{
      v.push({icon:'✅',tone:'accent',title:'Capture correcte',
        text:'Tu encaisses <b>'+capPct+'%</b> du mouvement offert, soit '+A.leftRPerTrade.toFixed(2)+'R laissés par gagnant. Marge de progression sur la partie haute des mouvements.'});
    }
  }

  // 2) Tes stops sont-ils bien placés ?
  if(A.maxMaeWin>0){
    if(A.maxMaeWin<0.7){
      v.push({icon:'🛡️',tone:'yellow',title:'Tes stops ont du mou',
        text:'Aucun de tes gagnants n\'a souffert plus de <b>-'+A.maxMaeWin.toFixed(2)+'R</b> avant de partir. Un stop à <b>-'+A.suggestedStopR.toFixed(1)+'R</b> les aurait tous préservés — tu pourrais resserrer pour améliorer ton R:R, ou augmenter la taille à risque $ constant. (Prudence : échantillon de gagnants, pas de garantie sur le futur.)'});
    }else if(A.maxMaeWin>0.92){
      v.push({icon:'🧊',tone:'accent',title:'Ne resserre pas tes stops',
        text:'Certains de tes gagnants sont allés chercher jusqu\'à <b>-'+A.maxMaeWin.toFixed(2)+'R</b> avant de fonctionner. Resserrer le stop aurait tué ces trades. Tes stops sont au bon endroit.'});
    }else{
      v.push({icon:'🛡️',tone:'green',title:'Stops bien calibrés',
        text:'Tes gagnants souffrent jusqu\'à -'+A.maxMaeWin.toFixed(2)+'R max avant de tourner. C\'est proche de ton risque plein sans le dépasser — placement de stop cohérent.'});
    }
  }

  // 3) Gains rendus
  if(A.gainsRendus.length){
    v.push({icon:'💸',tone:'red',title:A.gainsRendus.length+' gain'+(A.gainsRendus.length>1?'s':'')+' rendu'+(A.gainsRendus.length>1?'s':''),
      text:'<b>'+A.gainsRendus.length+'</b> trade'+(A.gainsRendus.length>1?'s':'')+' perdant'+(A.gainsRendus.length>1?'s étaient':' était')+' à <b>+'+(A.gainsRendusR/A.gainsRendus.length).toFixed(1)+'R</b> en moyenne avant de se retourner en perte. C\'est de la <b>gestion de sortie</b>, pas de la sélection : un breakeven mécanique après +1R aurait transformé ces pertes.'});
  }

  // 4) MAE des perdants vs gagnants (signal de sélection)
  if(A.avgMaeWin>0&&A.avgMaeLoss>0&&A.n>=6){
    var ratio=A.avgMaeLoss/A.avgMaeWin;
    if(A.avgMaeWin<A.avgMaeLoss*0.75){
      v.push({icon:'🔍',tone:'accent',title:'Signal d\'entrée exploitable',
        text:'Tes gagnants partent vite (MAE moyen <b>-'+A.avgMaeWin.toFixed(2)+'R</b>) alors que tes perdants s\'enfoncent plus (-'+A.avgMaeLoss.toFixed(2)+'R). Règle possible : si un trade dépasse -'+A.avgMaeWin.toFixed(1)+'R sans réagir, la probabilité qu\'il gagne chute.'});
    }
  }
  return v;
}

            +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">'+v.icon+'</span>'
            +'<span style="font-size:12px;font-weight:800;color:'+c+';letter-spacing:0.5px">'+v.title+'</span></div>'
            +'<div style="font-size:11px;color:var(--text);line-height:1.6">'+v.text+'</div></div>';
        }).join('')||'<div class="card" style="grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;padding:10px">Données insuffisantes pour un verdict fiable — continue à renseigner MAE/MFE.</div>';
      }
    }

    // KPIs
    var maeKpis=document.getElementById('mae-kpis');
    if(maeKpis){
      if(A.n){
        var capTxt=A.capture!==null?Math.round(A.capture*100)+'%':'—';
        var capC=A.capture===null?'var(--muted)':A.capture>=0.7?'var(--green)':A.capture>=0.5?'var(--yellow)':'var(--red)';
        var leftTxt=A.leftD!==null?fmt$(Math.round(A.leftD)):A.leftR.toFixed(1)+'R';
        maeKpis.innerHTML=''
          +'<div class="kpi"><div class="kpi-label">MAE MOYEN</div><div class="kpi-value" style="color:var(--red)">-'+A.avgMae.toFixed(2)+'R</div><div class="kpi-sub">'+A.n+' trades</div></div>'
          +'<div class="kpi"><div class="kpi-label">MFE MOYEN</div><div class="kpi-value" style="color:var(--green)">+'+A.avgMfe.toFixed(2)+'R</div><div class="kpi-sub">potentiel offert</div></div>'
          +'<div class="kpi"><div class="kpi-label">EFFICACITÉ CAPTURE</div><div class="kpi-value" style="color:'+capC+'">'+capTxt+'</div><div class="kpi-sub">du MFE encaissé</div></div>'
          +'<div class="kpi"><div class="kpi-label">LAISSÉ SUR LA TABLE</div><div class="kpi-value" style="color:var(--yellow)">'+leftTxt+'</div><div class="kpi-sub">total gagnants</div></div>'
          +'<div class="kpi"><div class="kpi-label">MAE MAX GAGNANT</div><div class="kpi-value" style="color:var(--accent2)">-'+A.maxMaeWin.toFixed(2)+'R</div><div class="kpi-sub">stop mini conseillé</div></div>'
          +'<div class="kpi"><div class="kpi-label">GAINS RENDUS</div><div class="kpi-value" style="color:'+(A.gainsRendus.length?'var(--red)':'var(--green)')+'">'+A.gainsRendus.length+'</div><div class="kpi-sub">+1R puis perdus</div></div>';
      }else{
        maeKpis.innerHTML='';
      }
    }

    if(!A.n)return;
    var rows=A.rows;

    // Chart 1: MAE moyen gagnants vs perdants + ligne stop plein
    var mwlC=document.getElementById('maeWinLossChart');
    if(mwlC){
      if(charts.maeWL){try{charts.maeWL.destroy();}catch(e){}}
      charts.maeWL=new Chart(mwlC,{type:'bar',data:{labels:['Gagnants','Perdants'],datasets:[{data:[A.avgMaeWin.toFixed(2),A.avgMaeLoss.toFixed(2)],backgroundColor:['rgba(0,212,106,0.12)','rgba(155,93,229,0.12)'],borderColor:['#00e676','#b57bee'],borderWidth:2,borderRadius:6}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return '-'+c.parsed.y+'R de drawdown moyen';}}}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},callback:function(v){return '-'+v+'R';}}}}}});
    }
    // Chart 2: Capture par tranche
    var capC2=document.getElementById('captureChart');
    if(capC2){
      var capBuckets={'<25%':0,'25-50%':0,'50-75%':0,'75-100%':0,'>100%':0};
      rows.forEach(function(r){
        if(r.mfeR===null||r.mfeR<=0.05||!r.isWin)return;
        var c=r.plR/r.mfeR*100;
        if(c<25)capBuckets['<25%']++;else if(c<50)capBuckets['25-50%']++;
        else if(c<75)capBuckets['50-75%']++;else if(c<=100)capBuckets['75-100%']++;else capBuckets['>100%']++;
      });
      var capKeys=Object.keys(capBuckets);
      if(charts.capture){try{charts.capture.destroy();}catch(e){}}
      charts.capture=new Chart(capC2,{type:'bar',data:{labels:capKeys,datasets:[{data:capKeys.map(function(k){return capBuckets[k];}),backgroundColor:capKeys.map(function(k){return k==='<25%'||k==='25-50%'?'rgba(155,93,229,0.15)':'rgba(0,212,106,0.12)';}),borderColor:capKeys.map(function(k){return k==='<25%'||k==='25-50%'?'#b57bee':'#00e676';}),borderWidth:2,borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},precision:0}}}}});
    }
    // Chart 3: MFE offert vs R encaissé (scatter) — la diagonale = capture parfaite
    var scC=document.getElementById('maeScatterChart');
    if(scC){
      if(charts.maeScatter){try{charts.maeScatter.destroy();}catch(e){}}
      var pts=rows.filter(function(r){return r.mfeR!==null;});
      var maxV=Math.max(1,Math.max.apply(null,pts.map(function(r){return Math.max(r.mfeR,r.plR);})));
      charts.maeScatter=new Chart(scC,{type:'scatter',data:{datasets:[
        {label:'Capture parfaite',type:'line',data:[{x:0,y:0},{x:maxV,y:maxV}],borderColor:'rgba(96,165,250,0.4)',borderDash:[5,5],pointRadius:0,fill:false},
        {label:'Gagnants',data:pts.filter(function(r){return r.isWin;}).map(function(r){return {x:r.mfeR,y:r.plR};}),backgroundColor:'#00e676'},
        {label:'Perdants',data:pts.filter(function(r){return !r.isWin;}).map(function(r){return {x:r.mfeR,y:r.plR};}),backgroundColor:'#b57bee'}
      ]},options:{plugins:{legend:{display:true,labels:{color:'#525278',font:{size:9},boxWidth:8}}},scales:{x:{title:{display:true,text:'MFE offert (R)',color:'#525278',font:{size:9}},grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:9}}},y:{title:{display:true,text:'R encaissé',color:'#525278',font:{size:9}},grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9}}}}}});
    }
    // Chart 4: distribution MFE
    var mfeC=document.getElementById('mfeDistChart');
    if(mfeC){
      var mfeVals=rows.filter(function(r){return r.mfeR!==null;}).map(function(r){return r.mfeR;});
      var mfeBuckets={};
      mfeVals.forEach(function(v){var b=Math.floor(v);var key=b+'R';mfeBuckets[key]=(mfeBuckets[key]||0)+1;});
      var mfeKeys=Object.keys(mfeBuckets).sort(function(a,b){return parseFloat(a)-parseFloat(b);});
      if(charts.mfeDist){try{charts.mfeDist.destroy();}catch(e){}}
      charts.mfeDist=new Chart(mfeC,{type:'bar',data:{labels:mfeKeys,datasets:[{data:mfeKeys.map(function(k){return mfeBuckets[k];}),backgroundColor:'rgba(0,212,106,0.12)',borderColor:'#00e676',borderWidth:2,borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},precision:0}}}}});
    }
  })();

}

function objectiveDetail(id){
  var o=DB.objectives.find(function(x){return x.id===id;});
  if(!o)return '<div class="empty-state"><p>Objectif introuvable</p></div>';
  var pfx=o.year+'-'+p(o.month);
  var acctLabel=(o.account&&o.account!=='Tous les comptes')?o.account:'Tous les comptes';
  var t=DB.trades.filter(function(x){return x.date&&x.date.startsWith(pfx)&&((!o.account||o.account==='Tous les comptes')||x.account===o.account);}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  var pl=t.reduce(function(s,x){return s+(parseFloat(x.plDollar)||0);},0);
  var wins=t.filter(function(x){return x.result==='Win'||x.result==='Win Partiel';}).length;
  var losses=t.filter(function(x){return x.result==='Loss';}).length;
  var wr=t.length?pct(wins,t.length):0;
  var avgRR=t.length?t.reduce(function(s,x){return s+(parseFloat(x.rrActual)||0);},0)/t.length:0;
  var prog=o.plTarget?Math.min(Math.max(pl/parseFloat(o.plTarget)*100,0),100):0;
  var progReal=o.plTarget?(pl/parseFloat(o.plTarget)*100):0;
  var remaining=o.plTarget?parseFloat(o.plTarget)-pl:0;
  var wrTargetMet=o.winrateTarget?wr>=parseFloat(o.winrateTarget):null;
  var tradesTargetMet=o.tradesTarget?t.length>=parseFloat(o.tradesTarget):null;
  var plc=pl>=0?'var(--green)':'var(--red)';
  var progColor=prog>=100?'var(--green)':prog>=50?'var(--accent)':'var(--yellow)';
  var bestTrade=t.length?t.slice().sort(function(a,b){return parseFloat(b.plDollar||0)-parseFloat(a.plDollar||0);})[0]:null;
  var worstTrade=t.length?t.slice().sort(function(a,b){return parseFloat(a.plDollar||0)-parseFloat(b.plDollar||0);})[0]:null;
  var cons=consistencyScore(t);
  return '<div class="flex-between" style="margin-bottom:6px">'
    +'<div><div class="page-title">ANALYSE OBJECTIF</div><div class="page-sub">'+MONTHS_FR[o.month-1]+' '+o.year+' · '+acctLabel+'</div></div>'
    +'<button class="btn btn-ghost btn-sm" onclick="backToObjectives()">Retour aux objectifs</button>'
    +'</div>'
    +'<div class="card" style="margin-bottom:14px;border-color:'+progColor+'40">'
    +'<div class="flex-between" style="margin-bottom:10px"><div class="card-title" style="margin:0">PROGRESSION VERS LA CIBLE</div><div style="font-size:20px;font-weight:900;color:'+progColor+'">'+progReal.toFixed(0)+'%</div></div>'
    +'<div class="progress-bar" style="height:14px"><div class="progress-fill" style="width:'+prog+'%;background:'+progColor+'"></div></div>'
    +'<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)"><span>Réalisé: <b style="color:'+plc+'">'+fmt$(Math.round(pl))+'</b></span><span>Cible: <b style="color:var(--text)">'+fmt$(o.plTarget)+'</b></span><span>'+(remaining>0?'Reste: <b style="color:var(--yellow)">'+fmt$(Math.round(remaining))+'</b>':'<b style="color:var(--green)">Cible atteinte!</b>')+'</span></div>'
    +'</div>'
    +'<div class="grid-6" style="margin-bottom:14px">'
    +'<div class="kpi"><div class="kpi-label">P&L RÉALISÉ</div><div class="kpi-value" style="color:'+plc+'">'+fmt$(Math.round(pl))+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">WIN RATE</div><div class="kpi-value" style="color:var(--accent)">'+wr+'%</div>'+(wrTargetMet!==null?'<div class="kpi-sub" style="color:'+(wrTargetMet?'var(--green)':'var(--red)')+'">cible '+o.winrateTarget+'%</div>':'')+'</div>'
    +'<div class="kpi"><div class="kpi-label">TRADES</div><div class="kpi-value">'+t.length+'</div>'+(tradesTargetMet!==null?'<div class="kpi-sub" style="color:'+(tradesTargetMet?'var(--green)':'var(--muted)')+'">cible '+o.tradesTarget+'</div>':'')+'</div>'
    +'<div class="kpi"><div class="kpi-label">RR MOYEN</div><div class="kpi-value" style="color:var(--yellow)">'+avgRR.toFixed(2)+'R</div></div>'
    +'<div class="kpi"><div class="kpi-label">CONSISTANCE</div><div class="kpi-value" style="color:'+scoreColor(cons.score)+'">'+cons.score+'%</div></div>'
    +'<div class="kpi"><div class="kpi-label">W / L</div><div class="kpi-value"><span style="color:var(--green)">'+wins+'</span> / <span style="color:var(--red)">'+losses+'</span></div></div>'
    +'</div>'
    +(t.length?'<div class="grid-2" style="margin-bottom:14px">'
      +'<div class="card"><div class="card-title">PROGRESSION CUMULÉE VS CIBLE</div><canvas id="objEqChart" height="120"></canvas></div>'
      +'<div class="card"><div class="card-title">P&L PAR JOUR</div><canvas id="objDayChart" height="120"></canvas></div>'
      +'</div>'
      +'<div class="grid-2" style="margin-bottom:14px">'
      +'<div class="card"><div class="card-title">WIN RATE PAR SETUP</div><canvas id="objSetupChart" height="120"></canvas></div>'
      +'<div class="card"><div class="card-title">RÉPARTITION RÉSULTATS</div><canvas id="objResultChart" height="120"></canvas></div>'
      +'</div>'
      +(bestTrade||worstTrade?'<div class="grid-2" style="margin-bottom:14px">'
        +(bestTrade?'<div class="card" style="border-color:rgba(0,212,106,0.3)"><div class="card-title">MEILLEUR TRADE</div><div style="font-size:20px;font-weight:900;color:var(--green);font-family:monospace">'+fmt$(parseFloat(bestTrade.plDollar||0))+'</div><div style="font-size:10px;color:var(--muted);margin-top:4px">'+(bestTrade.date||'').slice(0,10)+' · '+(bestTrade.instrument||'')+' '+(bestTrade.setup||'')+'</div></div>':'')
        +(worstTrade&&worstTrade!==bestTrade?'<div class="card" style="border-color:rgba(155,93,229,0.3)"><div class="card-title">PIRE TRADE</div><div style="font-size:20px;font-weight:900;color:var(--red);font-family:monospace">'+fmt$(parseFloat(worstTrade.plDollar||0))+'</div><div style="font-size:10px;color:var(--muted);margin-top:4px">'+(worstTrade.date||'').slice(0,10)+' · '+(worstTrade.instrument||'')+' '+(worstTrade.setup||'')+'</div></div>':'')
        +'</div>':'')
      :'<div class="empty-state"><div class="empty-icon">-</div><p>Aucun trade pour cet objectif</p></div>');
}
function initObjectiveCharts(id){

  var t=DB.trades.filter(function(x){return x.date&&x.date.startsWith(pfx)&&((!o.account||o.account==='Tous les comptes')||x.account===o.account);}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});

  ['objEq','objDay','objSetup','objResult'].forEach(function(k){if(charts[k]){try{charts[k].destroy();}catch(e){}}});
  var optsBase={plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9}}}}};
  // 1. Cumulative progression vs target
  var eqC=document.getElementById('objEqChart');
  if(eqC){
    var cum=0;var cumData=t.map(function(x){cum+=parseFloat(x.plDollar||0);return Math.round(cum);});
    var target=parseFloat(o.plTarget)||0;
    var targetLine=t.map(function(){return target;});
    var g=eqC.getContext('2d').createLinearGradient(0,0,0,150);
    g.addColorStop(0,cum>=0?'rgba(0,212,106,0.35)':'rgba(155,93,229,0.35)');g.addColorStop(1,'rgba(0,0,0,0)');
    charts.objEq=new Chart(eqC,{type:'line',data:{labels:t.map(function(_,i){return i+1;}),datasets:[{label:'Réalisé',data:cumData,borderColor:cum>=0?'#00e676':'#b57bee',backgroundColor:g,borderWidth:3,fill:true,tension:0.4,pointRadius:2},{label:'Cible',data:targetLine,borderColor:'#f97316',borderWidth:2,borderDash:[6,4],fill:false,pointRadius:0}]},options:{plugins:{legend:{display:true,labels:{color:'#525278',font:{size:10},boxWidth:10}}},scales:optsBase.scales}});
  }
  // 2. P&L per day
  var dayC=document.getElementById('objDayChart');
  if(dayC){
    var dayMap={};
    t.forEach(function(x){var d=(x.date||'').split('T')[0];dayMap[d]=(dayMap[d]||0)+(parseFloat(x.plDollar)||0);});
    var days=Object.keys(dayMap).sort();
    var dayPl=days.map(function(d){return Math.round(dayMap[d]);});
    charts.objDay=new Chart(dayC,{type:'bar',data:{labels:days.map(function(d){return d.slice(8)+'/'+d.slice(5,7);}),datasets:[{data:dayPl,backgroundColor:dayPl.map(function(v){return v>=0?'rgba(0,212,106,0.12)':'rgba(155,93,229,0.12)';}),borderColor:dayPl.map(function(v){return v>=0?'#00e676':'#b57bee';}),borderWidth:2,borderRadius:4}]},options:optsBase});
  }
  // 3. Win rate by setup
  var setC=document.getElementById('objSetupChart');
  if(setC){
    var setupMap={};
    t.forEach(function(x){var s=x.setup||'Autre';if(!setupMap[s])setupMap[s]={w:0,tot:0};setupMap[s].tot++;if(x.result==='Win'||x.result==='Win Partiel')setupMap[s].w++;});
    var setups=Object.keys(setupMap);
    var setupWr=setups.map(function(s){return Math.round(setupMap[s].w/setupMap[s].tot*100);});
    charts.objSetup=new Chart(setC,{type:'bar',data:{labels:setups,datasets:[{data:setupWr,backgroundColor:setups.map(function(s){return (SETUP_COLORS[s]||'#525278')+'20';}),borderColor:setups.map(function(s){return SETUP_COLORS[s]||'#525278';}),borderWidth:2,borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},callback:function(v){return v+'%';}},max:100}}}});
  }
  // 4. Result distribution doughnut
  var resC=document.getElementById('objResultChart');
  if(resC){
    var rD=[{n:'Win',v:t.filter(function(x){return x.result==='Win';}).length,c:'#00e676'},{n:'Win Partiel',v:t.filter(function(x){return x.result==='Win Partiel';}).length,c:'#3b82f6'},{n:'Breakeven',v:t.filter(function(x){return x.result==='Breakeven';}).length,c:'#f97316'},{n:'Loss',v:t.filter(function(x){return x.result==='Loss';}).length,c:'#b57bee'}].filter(function(d){return d.v>0;});
    charts.objResult=new Chart(resC,{type:'doughnut',data:{labels:rD.map(function(d){return d.n;}),datasets:[{data:rD.map(function(d){return d.v;}),backgroundColor:rD.map(function(d){return d.c+'30';}),borderColor:rD.map(function(d){return d.c;}),borderWidth:2}]},options:{plugins:{legend:{display:true,position:'right',labels:{color:'#525278',font:{size:10},boxWidth:10}}},cutout:'60%'}});
  }
}

// ── SESSIONS SCALP ───────────────────────────────────────────────────────────
// Un scalp en secondes n'a pas de setup/MAE/MFE : on le loggue par SESSION groupée.
// Le P&L rejoint les stats d'argent (dashboard, solde compte) mais le reste
// (win rate, nb de trades) vit ici, à part, sans polluer les stats ICT.
var scalpFilter='ALL';
var _editingScalpId=null;
function getScalps(){return DB._l('tj_scalps',[]);}
function setScalps(v){DB._s('tj_scalps',v);}
function getFilteredScalps(filter){
  var all=getScalps();
  if(!filter||filter==='ALL')return all;
  if(filter.indexOf('GROUP:')===0){
    var grp=filter.slice(6),names;
    if(grp==='Archivés')names=DB.accounts.filter(function(a){return a.archived;}).map(function(a){return a.name;});
    else{names=DB.accounts.filter(function(a){return a.group===grp;}).map(function(a){return a.name;});if(grp==='Backtest')names.push('Backtest');}
    return all.filter(function(s){return names.indexOf(s.account)>=0;});
  }
  return all.filter(function(s){return s.account===filter;});
}
function scalpAccountPL(accountName){
  return getScalps().filter(function(s){return s.account===accountName;}).reduce(function(a,s){return a+(parseFloat(s.plDollar)||0);},0);
}
function scalpTotals(list){
  var pl=0,plR=0,micro=0,wins=0;
  list.forEach(function(s){
    pl+=parseFloat(s.plDollar)||0;plR+=parseFloat(s.plR)||0;
    micro+=parseInt(s.nTrades)||0;wins+=parseInt(s.nWins)||0;
  });
  return {pl:pl,plR:plR,sessions:list.length,micro:micro,wins:wins,
    wr:micro>0?Math.round(wins/micro*100):0,
    avg:list.length?pl/list.length:0};
}

function scalps(){
  var list=getFilteredScalps(scalpFilter).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var T=scalpTotals(list);
  var head='<div class="flex-between" style="margin-bottom:14px;flex-wrap:wrap;gap:8px">'
    +'<div><div class="page-title">⚡ SCALP</div><div class="page-sub">SESSIONS GROUPÉES — HORS STATS ICT, P&L INCLUS DANS LE SOLDE</div></div>'
    +'<div class="flex-row">'+accountSelectHTML(scalpFilter,"scalpFilter=this.value;nav('scalps')")
    +'<button class="btn btn-primary btn-sm" onclick="openScalpModal()">+ Session scalp</button></div></div>';

  if(!list.length){
    return head+'<div class="card" style="margin-bottom:14px;border-color:rgba(59,130,246,0.3)"><div style="font-size:12px;color:var(--text);line-height:1.7;padding:6px">'
      +'Tu scalpes en secondes ? Ne loggue pas chaque micro-trade : regroupe-les en une <b>session</b>.<br>'
      +'<span style="font-size:11px;color:var(--muted)">Tu saisis juste le nb de trades, de gagnants et le P&L net. Ton win rate scalp et tes courbes vivent ici ; seul le P&L rejoint ton solde de compte et ton dashboard. Tes stats de setup/MAE/MFE ne bougent pas.</span>'
      +'<div style="margin-top:12px"><button class="btn btn-primary btn-sm" onclick="openScalpModal()">+ Créer ma première session</button></div></div></div>';
  }

  var plc=T.pl>=0?'var(--green)':'var(--red)';
  var kpis='<div class="grid-6" style="margin-bottom:14px">'
    +'<div class="kpi"><div class="kpi-label">P&L SCALP</div><div class="kpi-value" style="color:'+plc+'">'+fmt$(T.pl)+'</div><div class="kpi-sub">→ inclus au solde</div></div>'
    +'<div class="kpi"><div class="kpi-label">SESSIONS</div><div class="kpi-value">'+T.sessions+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">MICRO-TRADES</div><div class="kpi-value">'+T.micro+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">WIN RATE</div><div class="kpi-value" style="color:var(--accent)">'+(T.micro?T.wr+'%':'—')+'</div><div class="kpi-sub">'+T.wins+' / '+T.micro+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">P&L / SESSION</div><div class="kpi-value" style="color:'+(T.avg>=0?'var(--green)':'var(--red)')+'">'+fmt$(Math.round(T.avg))+'</div></div>'
    +'<div class="kpi"><div class="kpi-label">R NET</div><div class="kpi-value" style="color:'+(T.plR>=0?'var(--green)':'var(--red)')+'">'+fmtR(T.plR)+'</div></div>'
    +'</div>';

  var charts_='<div class="grid-2" style="margin-bottom:14px">'
    +'<div class="card"><div class="card-title">P&L CUMULÉ SCALP</div><canvas id="scalpCumChart" height="130"></canvas></div>'
    +'<div class="card"><div class="card-title">P&L PAR JOUR</div><canvas id="scalpDayChart" height="130"></canvas></div>'
    +'</div>';
  var coach='';try{coach=coachBlockHTML(DB.trades,0,{scope:'scalp',title:''});}catch(e){}

  var rows=list.map(function(s){
    var pl=parseFloat(s.plDollar)||0;var ic=instrColor(s.instrument);
    var wr=(parseInt(s.nTrades)||0)>0?Math.round((parseInt(s.nWins)||0)/(parseInt(s.nTrades))*100):0;
    return '<tr>'
      +'<td style="color:var(--muted);font-size:10px;white-space:nowrap">'+(s.date||'—')+'</td>'
      +'<td style="font-size:10px;color:var(--muted)">'+((s.account||'—').split('—')[0].trim())+'</td>'
      +'<td><span class="badge" style="background:'+ic+'20;color:'+ic+'">'+(s.instrument||'—')+'</span></td>'
      +'<td style="font-size:10px;color:var(--muted)">'+((s.session||'—').replace('Session ',''))+'</td>'
      +'<td style="font-family:monospace;font-size:11px">'+(s.nTrades||0)+'</td>'
      +'<td style="font-family:monospace;font-size:11px;color:var(--green)">'+(s.nWins||0)+'</td>'
      +'<td style="font-family:monospace;font-size:11px;color:'+(wr>=50?'var(--green)':'var(--yellow)')+'">'+wr+'%</td>'
      +'<td style="font-family:monospace;font-weight:800;color:'+(pl>=0?'var(--green)':'var(--red)')+'">'+fmt$(pl)+'</td>'
      +'<td style="font-family:monospace;font-size:10px;color:'+((parseFloat(s.plR)||0)>=0?'var(--green)':'var(--red)')+'">'+(s.plR!==''&&s.plR!==undefined?fmtR(s.plR):'—')+'</td>'
      +'<td style="font-size:10px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.note||'')+'</td>'
      +'<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="editScalp(\''+s.id+'\')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteScalp(\''+s.id+'\')">🗑</button></td>'
      +'</tr>';
  }).join('');
  var table='<div class="card"><div class="card-title">HISTORIQUE DES SESSIONS</div><div style="overflow-x:auto"><table><thead><tr>'
    +'<th>DATE</th><th>COMPTE</th><th>INSTR</th><th>SESSION</th><th>NB</th><th>WINS</th><th>WR</th><th>P&L</th><th>R</th><th>NOTE</th><th></th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';

  return head+kpis+coach+charts_+table;
}

function initScalpCharts(){
  var list=getFilteredScalps(scalpFilter).slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
  if(!list.length)return;
  // cumulé
  var cum=0,cumPts=[],labels=[];
  var byDay={};
  list.forEach(function(s){
    cum+=parseFloat(s.plDollar)||0;cumPts.push(Math.round(cum));labels.push(s.date||'');
    var d=s.date||'';byDay[d]=(byDay[d]||0)+(parseFloat(s.plDollar)||0);
  });
  var cc=document.getElementById('scalpCumChart');
  if(cc){if(charts.scalpCum){try{charts.scalpCum.destroy();}catch(e){}}
    charts.scalpCum=new Chart(cc,{type:'line',data:{labels:labels,datasets:[{data:cumPts,borderColor:'#e8b923',backgroundColor:'rgba(232,185,35,0.1)',fill:true,tension:0.3,pointRadius:2,borderWidth:2}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:8},maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},callback:function(v){return '$'+v;}}}}}});
  }
  var dayKeys=Object.keys(byDay).sort();
  var dc=document.getElementById('scalpDayChart');
  if(dc){if(charts.scalpDay){try{charts.scalpDay.destroy();}catch(e){}}
    charts.scalpDay=new Chart(dc,{type:'bar',data:{labels:dayKeys,datasets:[{data:dayKeys.map(function(k){return Math.round(byDay[k]);}),backgroundColor:dayKeys.map(function(k){return byDay[k]>=0?'rgba(0,212,106,0.15)':'rgba(155,93,229,0.15)';}),borderColor:dayKeys.map(function(k){return byDay[k]>=0?'#00e676':'#b57bee';}),borderWidth:2,borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#525278',font:{size:8},maxTicksLimit:10}},y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#525278',font:{size:9},callback:function(v){return '$'+v;}}}}}});
  }
}
